<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Diary — Дневник класса</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f2f2f7;
      --surface: rgba(255, 255, 255, 0.88);
      --surface-solid: #ffffff;
      --topbar: rgba(242, 242, 247, 0.84);
      --input-bg: #ffffff;
      --subtle-bg: rgba(118, 118, 128, 0.12);
      --seg-active: #ffffff;
      --text: #1c1c1e;
      --muted: #8e8e93;
      --border: rgba(60, 60, 67, 0.12);
      --accent: #007aff;
      --accent-hover: #0062cc;
      --green: #34c759;
      --red: #ff3b30;
      --orange: #ff9500;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
      --radius: 16px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #000000;
        --surface: rgba(28, 28, 30, 0.88);
        --surface-solid: #1c1c1e;
        --topbar: rgba(20, 20, 22, 0.84);
        --input-bg: #2c2c2e;
        --subtle-bg: rgba(118, 118, 128, 0.24);
        --seg-active: #3a3a3c;
        --text: #f5f5f7;
        --muted: #98989d;
        --border: rgba(255, 255, 255, 0.11);
        --accent: #0a84ff;
        --accent-hover: #409cff;
        --green: #30d158;
        --red: #ff453a;
        --orange: #ff9f0a;
        --shadow: 0 10px 34px rgba(0, 0, 0, 0.45);
      }
    }

    :root[data-theme="dark"] {
      --bg: #000000;
      --surface: rgba(28, 28, 30, 0.88);
      --surface-solid: #1c1c1e;
      --topbar: rgba(20, 20, 22, 0.84);
      --input-bg: #2c2c2e;
      --subtle-bg: rgba(118, 118, 128, 0.24);
      --seg-active: #3a3a3c;
      --text: #f5f5f7;
      --muted: #98989d;
      --border: rgba(255, 255, 255, 0.11);
      --accent: #0a84ff;
      --accent-hover: #409cff;
      --green: #30d158;
      --red: #ff453a;
      --orange: #ff9f0a;
      --shadow: 0 10px 34px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .hidden { display: none !important; }
    svg { display: block; flex-shrink: 0; }

    /* Auth */
    .auth-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 390px;
      background: var(--surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px;
      box-shadow: var(--shadow);
    }
    .auth-card h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -0.4px; }
    .auth-card p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }

    /* Top & Bottom Bars */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--topbar);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      max-width: 620px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 30;
      background: var(--topbar);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border-top: 1px solid var(--border);
      padding-bottom: var(--safe-bottom);
    }
    .bottom-nav-inner {
      max-width: 620px;
      margin: 0 auto;
      display: flex;
      height: 56px;
    }
    .nav-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.15s ease;
    }
    .nav-btn.active { color: var(--accent); }
    .nav-btn svg { width: 22px; height: 22px; }

    /* Segmented Control */
    .segmented {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: var(--subtle-bg);
      padding: 3px;
      border-radius: 12px;
      gap: 2px;
      width: 100%;
    }
    .segmented button {
      background: transparent;
      color: var(--muted);
      border: none;
      padding: 8px 6px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.16s ease;
    }
    .segmented button.active {
      background: var(--seg-active);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.14);
    }

    /* Avatar & Profile Pill */
    .profile-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--subtle-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 3px 11px 3px 3px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      overflow: hidden;
      flex-shrink: 0;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    .container {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      padding: 16px 16px 88px;
      flex: 1;
    }

    /* Days Bar (Пн-Пт) */
    .days-bar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      background: var(--subtle-bg);
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 16px;
    }
    .day-btn {
      border: none;
      background: transparent;
      padding: 9px 0;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      text-align: center;
      transition: 0.15s;
    }
    .day-btn.active {
      background: var(--seg-active);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .section-head h2 { margin: 0; font-size: 20px; font-weight: 700; }

    /* Controls */
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 13px; font-weight: 600; color: var(--muted); }
    input, textarea, select {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--input-bg);
      font-size: 15px;
      font-family: inherit;
      color: var(--text);
      outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 86px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 15px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }
    .btn.secondary { background: var(--subtle-bg); color: var(--text); }
    .btn.danger { background: rgba(255, 59, 48, 0.14); color: var(--red); }
    .btn.sm { padding: 8px 12px; font-size: 13px; border-radius: 10px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .stack { display: flex; flex-direction: column; gap: 12px; }
    .row { display: flex; gap: 10px; align-items: center; }

    /* Lesson Cards */
    .lesson-list { display: flex; flex-direction: column; gap: 8px; }
    .lesson-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      cursor: pointer;
    }
    .lesson-card.cancelled {
      background: rgba(255, 59, 48, 0.07);
      border-color: rgba(255, 59, 48, 0.25);
    }
    .lesson-card.done .lesson-title {
      text-decoration: line-through;
      color: var(--muted);
    }

    .check-btn {
      width: 24px;
      height: 24px;
      min-width: 24px;
      border-radius: 50%;
      border: 2px solid var(--muted);
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      color: #fff;
    }
    .check-btn.checked { background: var(--green); border-color: var(--green); }

    .lesson-num {
      width: 26px;
      height: 26px;
      min-width: 26px;
      border-radius: 8px;
      background: rgba(0, 122, 255, 0.12);
      color: var(--accent);
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lesson-card.cancelled .lesson-num {
      background: rgba(255, 59, 48, 0.14);
      color: var(--red);
    }
    .lesson-info { flex: 1; min-width: 0; }
    .lesson-title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .lesson-meta { margin-top: 2px; font-size: 12px; color: var(--muted); }
    .lesson-preview {
      margin-top: 4px;
      font-size: 13px;
      color: var(--text);
      opacity: 0.78;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Badges */
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .badge.red { background: rgba(255, 59, 48, 0.14); color: var(--red); }
    .badge.blue { background: rgba(0, 122, 255, 0.14); color: var(--accent); }
    .badge.orange { background: rgba(255, 149, 0, 0.16); color: var(--orange); }
    .badge.gray { background: var(--subtle-bg); color: var(--muted); }

    /* Member Cards */
    .member-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
    }
    .member-info { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .member-name { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .member-email { font-size: 12px; color: var(--muted); margin-top: 1px; }

    /* Modal iOS Sheet */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    @media (min-width: 520px) {
      .modal-backdrop { align-items: center; padding: 16px; }
    }
    .modal {
      width: 100%;
      background: var(--surface-solid);
      border: 1px solid var(--border);
      border-radius: 22px 22px 0 0;
      max-height: 92vh;
      overflow-y: auto;
      padding: 20px 16px calc(20px + var(--safe-bottom));
      box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.2);
    }
    @media (min-width: 520px) {
      .modal { border-radius: 22px; max-width: 500px; padding: 22px; }
    }
    .modal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
    .modal-head h3 { margin: 0; font-size: 19px; font-weight: 700; }
    .close-x {
      background: var(--subtle-bg);
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .hw-box { background: var(--bg); border: 1px solid var(--border); padding: 12px 14px; border-radius: 12px; font-size: 15px; line-height: 1.45; white-space: pre-wrap; margin-bottom: 12px; }

    /* Photos */
    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 6px; margin-bottom: 8px; }
    .photo-item { position: relative; border-radius: 10px; overflow: hidden; aspect-ratio: 1; background: var(--subtle-bg); }
    .photo-item img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
    .photo-del {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: none;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .upload-zone {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px;
      border: 1.5px dashed var(--border);
      border-radius: 12px;
      background: var(--bg);
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .empty { text-align: center; padding: 36px 16px; color: var(--muted); background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius); display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .msg { font-size: 12px; color: var(--red); min-height: 16px; }
    .msg.ok { color: var(--green); }
    .toggle-row { display: flex; align-items: center; gap: 10px; padding: 11px 13px; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; font-size: 14px; font-weight: 500; cursor: pointer; }
    .toggle-row input { width: auto; accent-color: var(--red); }

    .avatar-upload-wrap { display: flex; align-items: center; gap: 14px; background: var(--bg); border: 1px solid var(--border); padding: 12px; border-radius: 14px; }
    .avatar-large { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; overflow: hidden; flex-shrink: 0; }
    .avatar-large img { width: 100%; height: 100%; object-fit: cover; }

    .lightbox { position: fixed; inset: 0; z-index: 80; background: rgba(0, 0, 0, 0.94); display: flex; align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; }
    .lightbox img { max-width: 100%; max-height: 90vh; border-radius: 10px; }
  </style>
</head>
<body>

  <!-- АВТОРИЗАЦИЯ -->
  <div id="authView" class="auth-wrap">
    <div class="auth-card stack">
      <h1>Diary</h1>
      <p>Школьное расписание, ДЗ и фото</p>
      <input id="nameInput" type="text" placeholder="Имя и фамилия (для регистрации)" />
      <input id="emailInput" type="email" placeholder="Email" />
      <input id="passInput" type="password" placeholder="Пароль (от 6 символов)" />
      <div class="row">
        <button class="btn" style="flex:1" onclick="signIn()">Войти</button>
        <button class="btn secondary" style="flex:1" onclick="signUp()">Регистрация</button>
      </div>
      <div id="authMsg" class="msg"></div>
    </div>
  </div>

  <!-- ОСНОВНОЕ ПРИЛОЖЕНИЕ -->
  <div id="appView" class="hidden">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">Diary</div>
        <button class="profile-pill" onclick="openProfileSettings()">
          <span id="headerAvatar" class="avatar">?</span>
          <span id="headerName">...</span>
        </button>
      </div>
    </header>

    <main class="container">
      <!-- СТРАНИЦА ДЗ -->
      <section id="pageHw">
        <div class="days-bar" id="daysBar"></div>
        <div class="section-head">
          <h2 id="dayTitle">Понедельник</h2>
          <button id="addLessonBtn" class="btn sm hidden" onclick="openLessonModal(null)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>Урок</span>
          </button>
        </div>
        <div id="lessonsList" class="lesson-list"></div>
      </section>

      <!-- СТРАНИЦА УЧАСТНИКИ -->
      <section id="pageMembers" class="hidden">
        <div class="section-head">
          <h2>Участники</h2>
          <span id="myRoleBadge" class="badge gray"></span>
        </div>
        <div id="membersList" class="stack"></div>
      </section>
    </main>

    <!-- НИЖНЯЯ НАВИГАЦИЯ (однотонные Apple-иконки) -->
    <nav class="bottom-nav">
      <div class="bottom-nav-inner">
        <button id="navHw" class="nav-btn active" onclick="switchPage('hw')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="17" rx="3"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
            <path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"></path>
          </svg>
          <span>ДЗ</span>
        </button>
        <button id="navMembers" class="nav-btn" onclick="switchPage('members')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <span>Участники</span>
        </button>
      </div>
    </nav>
  </div>

  <!-- МОДАЛКИ -->
  <div id="modalBackdrop" class="modal-backdrop hidden" onclick="if(event.target===this) closeModal()">
    <div class="modal" id="modalContent"></div>
  </div>

  <!-- ЛАЙТБОКС -->
  <div id="lightbox" class="lightbox hidden" onclick="this.classList.add('hidden')">
    <img id="lightboxImg" src="" alt="Фото ДЗ" />
  </div>

  <datalist id="subjectSuggestions">
    <option value="Алгебра"></option>
    <option value="Геометрия"></option>
    <option value="Вероятность и статистика"></option>
    <option value="Физика"></option>
    <option value="Химия"></option>
    <option value="Биология"></option>
    <option value="Информатика"></option>
    <option value="Русский язык"></option>
    <option value="Литература"></option>
    <option value="Англ. язык"></option>
    <option value="История"></option>
    <option value="Обществознание"></option>
    <option value="География"></option>
    <option value="ОБЗР"></option>
    <option value="Физкультура"></option>
    <option value="Проектная деятельность"></option>
    <option value="Разговор о важном"></option>
    <option value="Россия — мои горизонты"></option>
  </datalist>

  <script>
    const SUPABASE_URL = 'https://cvjobvwcnuiplvwmvewv.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_IUujdNZtYjJNoGhrtgabHQ_70qDfFys';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const DAYS = [
      { id: 1, short: 'Пн', full: 'Понедельник' },
      { id: 2, short: 'Вт', full: 'Вторник' },
      { id: 3, short: 'Ср', full: 'Среда' },
      { id: 4, short: 'Чт', full: 'Четверг' },
      { id: 5, short: 'Пт', full: 'Пятница' }
    ];

    const LESSON_TIMES = {
      1: '08:15 - 08:55',
      2: '09:05 - 09:45',
      3: '09:55 - 10:35',
      4: '10:50 - 11:30',
      5: '11:45 - 12:25',
      6: '12:35 - 13:15',
      7: '13:25 - 14:05',
      8: '14:15 - 14:55',
      9: '15:05 - 15:45'
    };

    // Однотонные иконки в стиле Apple (SF Symbols)
    const ICON = {
      close: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
      check: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
      photo: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>`,

      plus: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`

    const today = new Date().getDay();

    let currentUser = null;

    // --- ОПТИМИЗАЦИЯ И СЖАТИЕ ФОТО (Canvas -> JPEG) ---
    function compressImage(file, maxSide = 1280, quality = 0.78) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(url);
          let { width, height } = img;
          if (width > maxSide || height > maxSide) {
            if (width >= height) {
              height = Math.round((height * maxSide) / width);
              width = maxSide;
            } else {
              width = Math.round((width * maxSide) / height);
              height = maxSide;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          canvas.toBlob(
            blob => blob ? resolve(blob) : reject(new Error('Не удалось сжать фото')),
            'image/jpeg',
            quality
          );
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error('Не удалось прочитать изображение'));
        };
        img.src = url;
      });
    }

    function applyTheme(theme) {
      const val = theme || 'auto';
      localStorage.setItem('diary_theme', val);
      if (val === 'auto') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', val);
    }
    applyTheme(localStorage.getItem('diary_theme') || 'auto');

    const isAdmin = () => currentProfile && (currentProfile.role === 'admin' || currentProfile.role === 'super_admin');
    const isSuperAdmin = () => currentProfile && currentProfile.role === 'super_admin';

    function esc(str = '') {
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    db.auth.onAuthStateChange(async (event, session) => {
      if (session?.user) {
        currentUser = session.user;
        await loadMyProfile();
        document.getElementById('authView').classList.add('hidden');
        document.getElementById('appView').classList.remove('hidden');
        renderDays();
        await loadHwData();
        if (currentPage === 'members') await loadMembers();
      } else {
        currentUser = null;
        currentProfile = null;
        document.getElementById('appView').classList.add('hidden');
        document.getElementById('authView').classList.remove('hidden');
      }
    });

    async function signUp() {
      const msg = document.getElementById('authMsg');
      msg.textContent = '';
      const fullName = document.getElementById('nameInput').value.trim();
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passInput').value;
      if (!fullName) { msg.textContent = 'Введите имя для регистрации'; return; }

      const { error } = await db.auth.signUp({
        email, password,
        options: { data: { full_name: fullName } }
      });
      if (error) msg.textContent = error.message;
      else msg.textContent = 'Аккаунт создан! Если включено подтверждение почты — проверьте email.';
    }

    async function signIn() {
      const msg = document.getElementById('authMsg');
      msg.textContent = '';
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passInput').value;
      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) msg.textContent = error.message;
    }

    async function signOut() {
      closeModal();
      await db.auth.signOut();
    }

    async function loadMyProfile() {
      const { data } = await db.from('profiles').select('*').eq('id', currentUser.id).single();
      currentProfile = data || { id: currentUser.id, email: currentUser.email, full_name: currentUser.email, role: 'user' };
      document.getElementById('addLessonBtn').classList.toggle('hidden', !isAdmin());

      const shortName = currentProfile.full_name.split(' ')[0] || 'Профиль';
      document.getElementById('headerName').textContent = shortName;

      const avatarEl = document.getElementById('headerAvatar');
      if (currentProfile.avatar_url) {
        avatarEl.innerHTML = `<img src="${esc(currentProfile.avatar_url)}" alt="" />`;
      } else {
        avatarEl.textContent = shortName[0].toUpperCase();
      }

      const roleLabels = { super_admin: 'Главный админ', admin: 'Админ', user: 'Ученик' };
      const badge = document.getElementById('myRoleBadge');
      badge.textContent = 'Вы: ' + roleLabels[currentProfile.role];
      badge.className = 'badge ' + (currentProfile.role === 'super_admin' ? 'orange' : currentProfile.role === 'admin' ? 'blue' : 'gray');
    }

    // --- НАСТРОЙКИ ПРОФИЛЯ ---
    function openProfileSettings() {
      const currentTheme = localStorage.getItem('diary_theme') || 'auto';
      const avatarHtml = currentProfile.avatar_url
        ? `<img src="${esc(currentProfile.avatar_url)}" alt="" />`
        : currentProfile.full_name[0].toUpperCase();

      document.getElementById('modalContent').innerHTML = `
        <div class="modal-head">
          <h3>Настройки профиля</h3>
          <button class="close-x" onclick="closeModal()">${ICON.close}</button>
        </div>
        <div class="stack">
          <div class="avatar-upload-wrap">
            <div class="avatar-large">${avatarHtml}</div>
            <div class="stack" style="gap:4px; flex:1;">
              <label class="btn sm secondary" style="cursor:pointer; width:fit-content;">
                ${ICON.photo}
                <span>Выбрать фото</span>
                <input type="file" accept="image/*" class="hidden" onchange="uploadAvatar(this.files[0])" />
              </label>
              <div style="font-size:12px; color:var(--muted);">Фото автоматически сожмётся</div>
            </div>
          </div>

          <div class="field">
            <label>Имя и фамилия</label>
            <input id="profNameInput" type="text" value="${esc(currentProfile.full_name)}" />
          </div>

            <label>Оформление</label>

              <button class="${currentTheme === 'light' ? 'active' : ''}" onclick="setThemeFromModal('light')">Светлая</button>
              <button class="${currentTheme === 'dark' ? 'active' : ''}" onclick="setThemeFromModal('dark')">Тёмная</button>
            </div>
          </div>

          <div id="profMsg" class="msg"></div>

          <div class="row" style="justify-content:space-between; margin-top:4px;">

        </div>

      document.getElementById('modalBackdrop').classList.remove('hidden');

    function setThemeFromModal(theme) {
      applyTheme(theme);
      openProfileSettings();
    }

    async function uploadAvatar(file) {
      if (!file) return;
      const msg = document.getElementById('profMsg');
      msg.className = 'msg';
      msg.textContent = 'Сжатие и загрузка...';

      try {
        const compressed = await compressImage(file, 400, 0.82);
        const path = `${currentUser.id}/${Date.now()}.jpg`;
        const { error: upErr } = await db.storage.from('avatars').upload(path, compressed, {
          contentType: 'image/jpeg',
          cacheControl: '3600',
          upsert: true
        });
        if (upErr) throw upErr;

        const { data: pub } = db.storage.from('avatars').getPublicUrl(path);
        const { error: dbErr } = await db.from('profiles').update({ avatar_url: pub.publicUrl }).eq('id', currentUser.id);
        if (dbErr) throw dbErr;

        await loadMyProfile();
        openProfileSettings();
      } catch (err) {
        msg.textContent = 'Ошибка: ' + err.message;
      }
    }

    async function saveProfileName() {
      const msg = document.getElementById('profMsg');
      msg.className = 'msg';
      msg.textContent = '';
      const newName = document.getElementById('profNameInput').value.trim();
      if (!newName) { msg.textContent = 'Имя не может быть пустым'; return; }

      const { error } = await db.from('profiles').update({ full_name: newName }).eq('id', currentUser.id);
      if (error) { msg.textContent = error.message; return; }

      await loadMyProfile();
      msg.className = 'msg ok';
      msg.textContent = 'Сохранено!';
    }

    // --- НАВИГАЦИЯ ---
    function switchPage(page) {
      currentPage = page;
      document.getElementById('pageHw').classList.toggle('hidden', page !== 'hw');
      document.getElementById('pageMembers').classList.toggle('hidden', page !== 'members');
      document.getElementById('navHw').classList.toggle('active', page === 'hw');
      document.getElementById('navMembers').classList.toggle('active', page === 'members');
      if (page === 'hw') loadHwData();
      else loadMembers();
    }

    function renderDays() {
      document.getElementById('daysBar').innerHTML = DAYS.map(d => `
        <button class="day-btn ${d.id === selectedDay ? 'active' : ''}" onclick="selectDay(${d.id})">${d.short}</button>
      `).join('');
      document.getElementById('dayTitle').textContent = DAYS.find(d => d.id === selectedDay).full;
    }

    function selectDay(dayId) {
      selectedDay = dayId;
      renderDays();
      renderLessons();
    }

    // --- УРОКИ И ДЗ ---
    async function loadHwData() {
      const [lessonsRes, compRes] = await Promise.all([
        db.from('lessons').select('*').order('lesson_number', { ascending: true }).order('id', { ascending: true }),
        db.from('user_completions').select('lesson_id').eq('user_id', currentUser.id).eq('completed', true)
      ]);
      lessonsCache = lessonsRes.data || [];
      completedSet = new Set((compRes.data || []).map(r => r.lesson_id));
      renderLessons();
    }

    function renderLessons() {
      const list = document.getElementById('lessonsList');
      const dayLessons = lessonsCache.filter(l => l.day_of_week === selectedDay);

      if (!dayLessons.length) {
        list.innerHTML = `
          <div class="empty">
            <div>На этот день уроков пока нет</div>
            ${isAdmin() ? `<button class="btn sm" onclick="openLessonModal(null)">${ICON.plus}<span>Добавить урок</span></button>` : ''}
          </div>
        `;
        return;
      }

      list.innerHTML = dayLessons.map(l => {
        const done = completedSet.has(l.id);
        const photosCount = (l.photo_urls || []).length;
        const meta = [l.lesson_time, l.teacher].filter(Boolean).map(esc).join(' · ');

        return `
          <div class="lesson-card ${l.is_cancelled ? 'cancelled' : ''} ${done ? 'done' : ''}" onclick="openLessonModal(${l.id})">
            <button class="check-btn ${done ? 'checked' : ''}" onclick="event.stopPropagation(); toggleDone(${l.id})">
              ${done ? ICON.check : ''}
            </button>
            <div class="lesson-num">${l.lesson_number}</div>
            <div class="lesson-info">
              <div class="lesson-title">
                <span>${esc(l.subject)}</span>
                ${l.is_cancelled ? '<span class="badge red">Отменён</span>' : ''}
                ${photosCount ? `<span class="badge blue">${ICON.photo} ${photosCount}</span>` : ''}
              </div>
              ${meta ? `<div class="lesson-meta">${meta}</div>` : ''}
              ${l.homework ? `<div class="lesson-preview">${esc(l.homework)}</div>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    async function toggleDone(lessonId) {
      const wasDone = completedSet.has(lessonId);
      if (wasDone) {
        completedSet.delete(lessonId);
        renderLessons();
        await db.from('user_completions').delete().eq('user_id', currentUser.id).eq('lesson_id', lessonId);
      } else {
        completedSet.add(lessonId);
        renderLessons();
        await db.from('user_completions').upsert({ user_id: currentUser.id, lesson_id: lessonId, completed: true });
      }
    }

    // --- ЕДИНОЕ ВСПЛЫВАЮЩЕЕ ОКНО УРОКА ---
    let editingPhotos = [];
    let pendingFiles = [];

    function openLessonModal(lessonId) {
      const l = lessonId ? lessonsCache.find(x => x.id === lessonId) : null;

      // Для обычных учеников — только просмотр ДЗ и фото
      if (!isAdmin()) {
        if (!l) return;
        const photos = (l.photo_urls || []).map(url => `
          <div class="photo-item">
            <img src="${esc(url)}" onclick="openLightbox('${esc(url)}')" alt="" />
          </div>
        `).join('');
        const meta = [l.lesson_time, l.teacher].filter(Boolean).map(esc).join(' · ');
        const done = completedSet.has(l.id);

        document.getElementById('modalContent').innerHTML = `
          <div class="modal-head">
            <div>
              <h3>${l.lesson_number}. ${esc(l.subject)}</h3>
              ${meta ? `<div style="font-size:13px; color:var(--muted); margin-top:4px;">${meta}</div>` : ''}
              ${l.is_cancelled ? '<span class="badge red" style="margin-top:6px;">Урока не будет</span>' : ''}
            </div>
            <button class="close-x" onclick="closeModal()">${ICON.close}</button>
          </div>
          <div class="hw-box">${l.homework ? esc(l.homework) : '<span style="color:var(--muted)">Домашнее задание не задано</span>'}</div>
          ${photos ? `<div class="photo-grid">${photos}</div>` : ''}
          <button class="btn ${done ? 'secondary' : ''} sm" style="width:100%; margin-top:6px;"
            onclick="toggleDone(${l.id}); openLessonModal(${l.id});">
            ${done ? `${ICON.check}<span>Сделано (снять отметку)</span>` : 'Отметить сделанным'}
          </button>
        `;
        document.getElementById('modalBackdrop').classList.remove('hidden');
        return;
      }

      // Для админов — всё в одном окне (отметка, редактирование, фото, удаление)
      editingPhotos = l ? [...(l.photo_urls || [])] : [];
      pendingFiles = [];
      const dayVal = l ? l.day_of_week : selectedDay;
      const nextNum = lessonsCache.filter(x => x.day_of_week === dayVal).length + 1;
      const numVal = l ? l.lesson_number : nextNum;
      const timeVal = l ? l.lesson_time : (LESSON_TIMES[numVal] || '');
      const done = l ? completedSet.has(l.id) : false;

      document.getElementById('modalContent').innerHTML = `
        <div class="modal-head">
          <h3>${l ? 'Урок и ДЗ' : 'Новый урок'}</h3>
          <button class="close-x" onclick="closeModal()">${ICON.close}</button>
        </div>
        <div class="stack">
          ${l ? `
            <button class="btn ${done ? '' : 'secondary'} sm" style="width:100%;"
              onclick="toggleDone(${l.id}); openLessonModal(${l.id});">
              ${done ? `${ICON.check}<span>Отмечено выполненным у вас</span>` : 'Отметить выполненным у себя'}
            </button>
          ` : ''}

          <div class="row">
            <div class="field" style="flex:1;">
              <label>День недели</label>
              <select id="edDay">
                ${DAYS.map(d => `<option value="${d.id}" ${d.id === dayVal ? 'selected' : ''}>${d.full}</option>`).join('')}
              </select>
            </div>
            <div class="field" style="width:88px;">
              <label>Урок №</label>
              <input id="edNum" type="number" min="1" max="12" value="${numVal}" onchange="autoFillTime(this.value)" />
            </div>
          </div>

          <div class="field">
            <label>Предмет</label>
            <input id="edSubj" list="subjectSuggestions" type="text" value="${l ? esc(l.subject) : ''}" placeholder="Например: Физика" />
          </div>

          <div class="row">
            <div class="field" style="flex:1;">
              <label>Учитель</label>
              <input id="edTeacher" type="text" value="${l ? esc(l.teacher) : ''}" placeholder="Фамилия И.О." />
            </div>
            <div class="field" style="width:135px;">
              <label>Время</label>
              <input id="edTime" type="text" value="${esc(timeVal)}" placeholder="08:15 - 08:55" />
            </div>
          </div>

          <div class="field">
            <label>Домашнее задание</label>
            <textarea id="edHw" placeholder="Что задали...">${l ? esc(l.homework) : ''}</textarea>
          </div>

          <label class="toggle-row">
            <input id="edCancel" type="checkbox" ${l?.is_cancelled ? 'checked' : ''} />
            <span>Урока не будет (отменён)</span>
          </label>

          <div class="field">
            <label>Фотографии к ДЗ (сжимаются автоматически)</label>
            <div id="edPhotoGrid" class="photo-grid"></div>
            <label class="upload-zone">
              ${ICON.photo}
              <span>Добавить фотографии</span>
              <input id="edPhotoFile" type="file" accept="image/*" multiple class="hidden" onchange="handleNewPhotos(this.files)" />
            </label>
          </div>

          <div id="edMsg" class="msg"></div>

          <div class="row" style="justify-content: space-between; margin-top:4px;">
            ${l ? `<button class="btn danger sm" onclick="deleteLesson(${l.id})">${ICON.trash}<span>Удалить</span></button>` : '<span></span>'}
            <div class="row" style="gap:6px;">
              <button class="btn secondary sm" onclick="closeModal()">Отмена</button>
              <button id="saveLessonBtn" class="btn sm" onclick="saveLesson(${l ? l.id : 'null'})">Сохранить</button>
            </div>
          </div>
        </div>
      `;
      renderEditingPhotos();
      document.getElementById('modalBackdrop').classList.remove('hidden');
    }

    function autoFillTime(num) {
      const timeInput = document.getElementById('edTime');
      if (timeInput && LESSON_TIMES[num]) timeInput.value = LESSON_TIMES[num];
    }

    function handleNewPhotos(fileList) {
      for (const file of fileList) {
        pendingFiles.push({ file, preview: URL.createObjectURL(file) });
      }
      renderEditingPhotos();
    }

    function renderEditingPhotos() {
      const grid = document.getElementById('edPhotoGrid');
      if (!grid) return;
      const savedHtml = editingPhotos.map((url, idx) => `
        <div class="photo-item">
          <img src="${esc(url)}" onclick="openLightbox('${esc(url)}')" />
          <button class="photo-del" onclick="editingPhotos.splice(${idx},1); renderEditingPhotos();">${ICON.close}</button>
        </div>
      `).join('');
      const pendingHtml = pendingFiles.map((item, idx) => `
        <div class="photo-item">
          <img src="${item.preview}" onclick="openLightbox('${item.preview}')" />
          <button class="photo-del" onclick="pendingFiles.splice(${idx},1); renderEditingPhotos();">${ICON.close}</button>
        </div>
      `).join('');
      grid.innerHTML = savedHtml + pendingHtml;
    }

    async function saveLesson(lessonId) {
      const btn = document.getElementById('saveLessonBtn');
      const msg = document.getElementById('edMsg');
      msg.textContent = '';

      const day_of_week = parseInt(document.getElementById('edDay').value, 10);
      const lesson_number = parseInt(document.getElementById('edNum').value, 10) || 1;
      const subject = document.getElementById('edSubj').value.trim();
      const teacher = document.getElementById('edTeacher').value.trim();
      const lesson_time = document.getElementById('edTime').value.trim();
      const homework = document.getElementById('edHw').value.trim();
      const is_cancelled = document.getElementById('edCancel').checked;

      if (!subject) { msg.textContent = 'Введите название предмета'; return; }

      btn.disabled = true;
      btn.textContent = pendingFiles.length ? 'Сжатие фото...' : 'Сохранение...';

      try {
        for (const item of pendingFiles) {
          const compressed = await compressImage(item.file, 1280, 0.78);
          const path = `${Date.now()}_${Math.random().toString(36).slice(2)}.jpg`;
          const { error: upErr } = await db.storage.from('diary-photos').upload(path, compressed, {
            contentType: 'image/jpeg'
          });
          if (upErr) throw upErr;
          const { data: pub } = db.storage.from('diary-photos').getPublicUrl(path);
          editingPhotos.push(pub.publicUrl);
        }

        const payload = { day_of_week, lesson_number, subject, teacher, lesson_time, homework, is_cancelled, photo_urls: editingPhotos };
        const { error } = lessonId
          ? await db.from('lessons').update(payload).eq('id', lessonId)
          : await db.from('lessons').insert([payload]);

        if (error) throw error;

        selectedDay = day_of_week;
        closeModal();
        renderDays();
        await loadHwData();
      } catch (err) {
        msg.textContent = err.message;
        btn.disabled = false;
        btn.textContent = 'Сохранить';
      }
    }

    async function deleteLesson(lessonId) {
      if (!confirm('Удалить этот урок из расписания?')) return;
      const { error } = await db.from('lessons').delete().eq('id', lessonId);
      if (error) { alert('Не удалось удалить: ' + error.message); return; }
      closeModal();
      await loadHwData();
    }

    function closeModal() {
      document.getElementById('modalBackdrop').classList.add('hidden');
    }

    function openLightbox(url) {
      document.getElementById('lightboxImg').src = url;
      document.getElementById('lightbox').classList.remove('hidden');
    }

    // --- УЧАСТНИКИ ---
    async function loadMembers() {
      const { data, error } = await db.from('profiles').select('*').order('created_at', { ascending: true });
      const list = document.getElementById('membersList');
      if (error) { list.innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }

      const order = { super_admin: 0, admin: 1, user: 2 };
      data.sort((a, b) => order[a.role] - order[b.role]);

      const labels = {
        super_admin: '<span class="badge orange">Главный админ</span>',
        admin: '<span class="badge blue">Админ</span>',
        user: '<span class="badge gray">Ученик</span>'
      };

      list.innerHTML = data.map(u => {
        const canManage = isSuperAdmin() && u.role !== 'super_admin' && u.id !== currentUser.id;
        const avatarHtml = u.avatar_url
          ? `<img src="${esc(u.avatar_url)}" alt="" />`
          : (u.full_name[0] || '?').toUpperCase();

        return `
          <div class="member-card">
            <div class="member-info">
              <div class="avatar" style="width:36px; height:36px; font-size:14px;">${avatarHtml}</div>
              <div>
                <div class="member-name">${esc(u.full_name)} ${labels[u.role]}</div>
                <div class="member-email">${esc(u.email)}</div>
              </div>
            </div>
            ${canManage ? `
              <button class="btn sm ${u.role === 'admin' ? 'danger' : 'secondary'}" style="font-size:12px; padding:6px 10px;"
                onclick="toggleAdminRole('${u.id}', '${u.role === 'admin' ? 'user' : 'admin'}')">
                ${u.role === 'admin' ? 'Снять' : 'Админ'}
              </button>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    async function toggleAdminRole(userId, newRole) {
      const { error } = await db.from('profiles').update({ role: newRole }).eq('id', userId);
      if (error) alert('Ошибка: ' + error.message);
      else await loadMembers();
    }
  </script>
</body>
</html>
