<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Diary — Дневник класса</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <style>
    :root {
      --bg: #f2f2f7;
      --surface-solid: #ffffff;
      --topbar: rgba(242, 242, 247, 0.84);
      --dock-bg: rgba(255, 255, 255, 0.86);
      --input-bg: #ffffff;
      --subtle-bg: rgba(118, 118, 128, 0.12);
      --seg-active: #ffffff;
      --cancelled-bg: rgba(255, 59, 48, 0.09);
      --window-bg: rgba(142, 142, 147, 0.14);
      --text: #1c1c1e;
      --muted: #8e8e93;
      --border: rgba(60, 60, 67, 0.12);
      --accent: #007aff;
      --accent-soft: rgba(0, 122, 255, 0.12);
      --green: #34c759;
      --red: #ff3b30;
      --orange: #ff9500;
      --card-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
      --dock-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      --drag-shadow: 0 16px 38px rgba(0, 0, 0, 0.18);
      --radius: 18px;
      --app-width: 520px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --ease-ios: cubic-bezier(0.32, 0.72, 0, 1);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #000000;
        --surface-solid: #1c1c1e;
        --topbar: rgba(18, 18, 20, 0.84);
        --dock-bg: rgba(34, 34, 38, 0.88);
        --input-bg: #2c2c2e;
        --subtle-bg: rgba(118, 118, 128, 0.24);
        --seg-active: #3a3a3c;
        --cancelled-bg: rgba(255, 69, 58, 0.14);
        --window-bg: rgba(142, 142, 147, 0.15);
        --text: #f5f5f7;
        --muted: #98989d;
        --border: rgba(255, 255, 255, 0.11);
        --accent: #0a84ff;
        --accent-soft: rgba(10, 132, 255, 0.16);
        --green: #30d158;
        --red: #ff453a;
        --orange: #ff9f0a;
        --card-shadow: none;
        --dock-shadow: 0 12px 36px rgba(0, 0, 0, 0.65);
        --drag-shadow: 0 18px 42px rgba(0, 0, 0, 0.7);
      }
    }

    :root[data-theme="dark"] {
      --bg: #000000;
      --surface-solid: #1c1c1e;
      --topbar: rgba(18, 18, 20, 0.84);
      --dock-bg: rgba(34, 34, 38, 0.88);
      --input-bg: #2c2c2e;
      --subtle-bg: rgba(118, 118, 128, 0.24);
      --seg-active: #3a3a3c;
      --cancelled-bg: rgba(255, 69, 58, 0.14);
      --window-bg: rgba(142, 142, 147, 0.15);
      --text: #f5f5f7;
      --muted: #98989d;
      --border: rgba(255, 255, 255, 0.11);
      --accent: #0a84ff;
      --accent-soft: rgba(10, 132, 255, 0.16);
      --green: #30d158;
      --red: #ff453a;
      --orange: #ff9f0a;
      --card-shadow: none;
      --dock-shadow: 0 12px 36px rgba(0, 0, 0, 0.65);
      --drag-shadow: 0 18px 42px rgba(0, 0, 0, 0.7);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.24s ease, color 0.24s ease;
    }

    body {
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .hidden { display: none !important; }
    svg { display: block; flex-shrink: 0; }

    /* Экран загрузки */
    .splash-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      text-align: center;
      transition: opacity 0.28s ease, visibility 0.28s ease;
    }
    .splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .splash-icon {
      width: 78px;
      height: 78px;
      border-radius: 20px;
      object-fit: cover;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22);
      animation: splashPulse 1.8s ease-in-out infinite;
    }
    .splash-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .spinner {
      width: 22px;
      height: 22px;
      border: 2.5px solid var(--subtle-bg);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    .splash-error {
      max-width: 340px;
      background: var(--surface-solid);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
    }
    .splash-error strong { color: var(--red); font-size: 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes splashPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    /* Плавные GPU-анимации */
    @keyframes tabEnter {
      from { opacity: 0; transform: translate3d(0, 6px, 0); }
      to { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    @keyframes daySlideNext {
      from { opacity: 0; transform: translate3d(12px, 0, 0); }
      to { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    @keyframes daySlidePrev {
      from { opacity: 0; transform: translate3d(-12px, 0, 0); }
      to { opacity: 1; transform: translate3d(0, 0, 0); }
    }

    .tab-enter { animation: tabEnter 0.22s var(--ease-ios) both; will-change: transform, opacity; }
    .day-slide-next { animation: daySlideNext 0.2s var(--ease-ios) both; will-change: transform, opacity; }
    .day-slide-prev { animation: daySlidePrev 0.2s var(--ease-ios) both; will-change: transform, opacity; }

    /* Авторизация */
    .auth-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 390px;
      background: var(--surface-solid);
      border-radius: 26px;
      padding: 26px;
      box-shadow: var(--dock-shadow);
      animation: tabEnter 0.28s var(--ease-ios) both;
    }
    .auth-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .auth-icon {
      width: 46px;
      height: 46px;
      border-radius: 13px;
      object-fit: cover;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16);
      flex-shrink: 0;
    }
    .auth-brand h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
    .auth-brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }

    .auth-notice {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 12px 13px;
      border-radius: 14px;
      background: var(--accent-soft);
      color: var(--text);
      font-size: 13px;
      line-height: 1.45;
      animation: tabEnter 0.22s var(--ease-ios) both;
    }
    .auth-notice svg { color: var(--accent); margin-top: 2px; }
    .auth-notice strong { display: block; margin-bottom: 2px; font-size: 14px; }

    /* Верхняя панель */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--topbar);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      width: 100%;
      max-width: var(--app-width);
      margin: 0 auto;
      padding: 11px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      object-fit: cover;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.16);
    }

    /* Нижняя плавающая панель */
    .bottom-nav-wrap {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(14px + var(--safe-bottom));
      z-index: 30;
      display: flex;
      justify-content: center;
      padding: 0 16px;
      pointer-events: none;
    }
    .bottom-nav {
      pointer-events: auto;
      position: relative;
      width: 100%;
      max-width: 310px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      padding: 5px;
      border-radius: 24px;
      background: var(--dock-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      box-shadow: var(--dock-shadow);
    }
    .nav-slider {
      position: absolute;
      top: 5px;
      left: 5px;
      width: calc((100% - 10px) / 2);
      height: calc(100% - 10px);
      border-radius: 19px;
      background: var(--subtle-bg);
      transform: translate3d(calc(var(--idx, 0) * 100%), 0, 0);
      transition: transform 0.28s var(--ease-ios);
      will-change: transform;
      pointer-events: none;
    }
    .nav-btn {
      position: relative;
      z-index: 1;
      border: none;
      background: transparent;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 7px 0;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.18s ease, transform 0.14s var(--ease-ios);
    }
    .nav-btn:active { transform: scale(0.94); }
    .nav-btn.active { color: var(--accent); }
    .nav-btn svg { width: 21px; height: 21px; }

    /* Контейнер */
    .container {
      width: 100%;
      max-width: var(--app-width);
      margin: 0 auto;
      padding: 16px 16px calc(96px + var(--safe-bottom));
      flex: 1;
    }

    /* Профиль в шапке */
    .profile-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--subtle-bg);
      border: none;
      color: var(--text);
      padding: 3px 12px 3px 3px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.16s var(--ease-ios);
    }
    .profile-pill:active { transform: scale(0.95); }
    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      overflow: hidden;
      flex-shrink: 0;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    /* Вкладки дней недели (Пн–Пт) */
    .days-bar {
      position: relative;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: var(--subtle-bg);
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 16px;
    }
    .day-slider {
      position: absolute;
      top: 4px;
      left: 4px;
      width: calc((100% - 8px) / 5);
      height: calc(100% - 8px);
      border-radius: 10px;
      background: var(--seg-active);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      transform: translate3d(calc(var(--idx, 0) * 100%), 0, 0);
      transition: transform 0.26s var(--ease-ios);
      will-change: transform;
      pointer-events: none;
    }
    .day-btn {
      position: relative;
      z-index: 1;
      border: none;
      background: transparent;
      padding: 9px 0;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      text-align: center;
      transition: color 0.18s ease;
    }
    .day-btn.active { color: var(--text); }

    /* Segmented Control */
    .segmented {
      position: relative;
      display: grid;
      grid-template-columns: repeat(var(--cols, 3), 1fr);
      background: var(--subtle-bg);
      padding: 3px;
      border-radius: 12px;
      width: 100%;
    }
    .seg-slider {
      position: absolute;
      top: 3px;
      left: 3px;
      width: calc((100% - 6px) / var(--cols, 3));
      height: calc(100% - 6px);
      border-radius: 9px;
      background: var(--seg-active);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
      transform: translate3d(calc(var(--idx, 0) * 100%), 0, 0);
      transition: transform 0.26s var(--ease-ios);
      will-change: transform;
      pointer-events: none;
    }
    .segmented button {
      position: relative;
      z-index: 1;
      background: transparent;
      color: var(--muted);
      border: none;
      padding: 8px 6px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.18s ease;
    }
    .segmented button.active { color: var(--text); }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .section-head h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }

    /* Поля и кнопки */
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 13px; font-weight: 600; color: var(--muted); }
    input, textarea, select {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--input-bg);
      font-size: 15px;
      font-family: inherit;
      color: var(--text);
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.14);
    }
    textarea { resize: vertical; min-height: 86px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 11px 15px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      transition: transform 0.14s var(--ease-ios), opacity 0.18s ease;
    }
    .btn:active { transform: scale(0.96); }
    .btn.secondary { background: var(--subtle-bg); color: var(--text); }
    .btn.danger { background: rgba(255, 59, 48, 0.14); color: var(--red); }
    .btn.sm { padding: 8px 12px; font-size: 13px; border-radius: 10px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .stack { display: flex; flex-direction: column; gap: 12px; }
    .row { display: flex; gap: 10px; align-items: center; }

    /* Карточки уроков и Drag-and-Drop */
    .lesson-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
      position: relative;
    }
    .lesson-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface-solid);
      border: none;
      box-shadow: var(--card-shadow);
      border-radius: var(--radius);
      padding: 13px 14px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.16s var(--ease-ios), opacity 0.2s ease, background-color 0.2s ease;
    }
    .lesson-card:active { transform: scale(0.985); }
    .lesson-card.cancelled { background: var(--cancelled-bg); }
    .lesson-card.done { opacity: 0.65; }
    .lesson-card.done .lesson-title span:first-child {
      text-decoration: line-through;
      color: var(--muted);
    }

    /* Карточка окна ("Нет урока") — серый цвет */
    .lesson-card.window {
      background: var(--window-bg);
      box-shadow: none;
    }
    .lesson-card.window.static-card { cursor: default; }
    .lesson-card.window.static-card:active { transform: none; }
    .lesson-card.window .lesson-num {
      background: var(--subtle-bg);
      color: var(--muted);
    }
    .lesson-card.window .lesson-title {
      color: var(--muted);
      font-weight: 500;
    }
    .lesson-card.window .lesson-preview { color: var(--muted); }
    .window-mark {
      width: 24px;
      height: 24px;
      min-width: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      opacity: 0.55;
    }

    .lesson-card.dragging {
      position: fixed;
      z-index: 60;
      margin: 0;
      box-shadow: var(--drag-shadow);
      opacity: 0.96;
      transform: scale(1.02);
      transition: none !important;
      pointer-events: none;
    }
    .drag-placeholder {
      border-radius: var(--radius);
      background: var(--subtle-bg);
      border: 1.5px dashed var(--accent);
      opacity: 0.55;
      flex-shrink: 0;
    }
    .drag-handle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 36px;
      margin-right: -4px;
      color: var(--muted);
      opacity: 0.65;
      cursor: grab;
      touch-action: none;
      flex-shrink: 0;
      border-radius: 8px;
      transition: opacity 0.15s ease, color 0.15s ease;
    }
    .drag-handle:hover, .drag-handle:active {
      opacity: 1;
      color: var(--text);
      cursor: grabbing;
    }

    .check-btn {
      width: 24px;
      height: 24px;
      min-width: 24px;
      border-radius: 50%;
      border: 2px solid var(--muted);
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      color: #fff;
      transition: background-color 0.18s ease, border-color 0.18s ease, transform 0.16s var(--ease-ios);
    }
    .check-btn:active { transform: scale(0.86); }
    .check-btn.checked { background: var(--green); border-color: var(--green); }

    .lesson-num {
      width: 27px;
      height: 27px;
      min-width: 27px;
      border-radius: 9px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lesson-card.cancelled .lesson-num {
      background: rgba(255, 59, 48, 0.15);
      color: var(--red);
    }
    .lesson-info { flex: 1; min-width: 0; }
    .lesson-title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .lesson-meta { margin-top: 2px; font-size: 12px; color: var(--muted); }
    .lesson-preview {
      margin-top: 4px;
      font-size: 13px;
      color: var(--text);
      opacity: 0.8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Бейджи */
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .badge.red { background: rgba(255, 59, 48, 0.14); color: var(--red); }
    .badge.blue { background: var(--accent-soft); color: var(--accent); }
    .badge.orange { background: rgba(255, 149, 0, 0.16); color: var(--orange); }
    .badge.gray { background: var(--subtle-bg); color: var(--muted); }

    /* Карточки участников */
    .member-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--surface-solid);
      border: none;
      box-shadow: var(--card-shadow);
      border-radius: var(--radius);
      padding: 12px 14px;
    }
    .member-info { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .member-name { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .member-email { font-size: 12px; color: var(--muted); margin-top: 1px; }

    /* Модальное окно */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.22s ease, visibility 0.22s ease;
    }
    .modal-backdrop.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    .modal {
      width: 100%;
      max-width: 470px;
      max-height: 88vh;
      overflow-y: auto;
      background: var(--surface-solid);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.3);
      transform: translate3d(0, 18px, 0) scale(0.96);
      opacity: 0;
      transition: transform 0.28s var(--ease-ios), opacity 0.2s ease;
      will-change: transform, opacity;
    }
    .modal-backdrop.open .modal {
      transform: translate3d(0, 0, 0) scale(1);
      opacity: 1;
    }

    function loadScript(src, timeoutMs = 6000) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        const timer = setTimeout(() => {
          s.remove();
          reject(new Error('Таймаут загрузки скрипта'));
        }, timeoutMs);
        s.src = src;
        s.onload = () => { clearTimeout(timer); resolve(); };
        s.onerror = () => { clearTimeout(timer); s.remove(); reject(new Error('Ошибка сети')); };
        document.head.appendChild(s);
      });
    }

    function compressImage(file, maxSide = 1280, quality = 0.78) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(url);
          let { width, height } = img;
          if (width > maxSide || height > maxSide) {
            if (width >= height) {
              height = Math.round((height * maxSide) / width);
              width = maxSide;
            } else {
              width = Math.round((width * maxSide) / height);
              height = maxSide;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          canvas.toBlob(
            blob => blob ? resolve(blob) : reject(new Error('Не удалось сжать фото')),
            'image/jpeg',
            quality
          );
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error('Не удалось прочитать изображение'));
        };
        img.src = url;
      });
    }

    function translateAuthError(message = '') {
      const m = message.toLowerCase();
      if (m.includes('invalid login credentials')) return 'Неверный email или пароль';
      if (m.includes('email not confirmed')) return 'Почта ещё не подтверждена — перейдите по ссылке из письма';

    async function handleAuthSubmit(e) {
      e.preventDefault();
      if (!db) return;
      const msg = document.getElementById('authMsg');
      const notice = document.getElementById('authNotice');
      const btn = document.getElementById('authSubmitBtn');
      msg.textContent = '';
      notice.classList.add('hidden');

      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passInput').value;
      const fullName = document.getElementById('nameInput').value.trim();

      if (authMode === 'signup' && !fullName) {
        msg.textContent = 'Введите имя и фамилию';
        return;
      }

      btn.disabled = true;
      btn.textContent = authMode === 'signup' ? 'Создание...' : 'Вход...';

      try {
        if (authMode === 'login') {
          const { error } = await db.auth.signInWithPassword({ email, password });
          if (error) msg.textContent = translateAuthError(error.message);
        } else {
          const { data, error } = await db.auth.signUp({
            email,
            password,
            options: { data: { full_name: fullName } }
          });
          if (error) {
            msg.textContent = translateAuthError(error.message);
          } else if (data?.user && !data?.session) {
            notice.innerHTML = `
              ${ICON.mail}
              <div>
                <strong>Подтвердите почту</strong>
                Мы отправили письмо со ссылкой на <b>${esc(email)}</b>. Откройте его (если не нашли — проверьте папку «Спам»), а затем войдите в аккаунт.
              </div>
            `;
            notice.classList.remove('hidden');
          }
        }
      } finally {
        btn.disabled = false;
        btn.textContent = authMode === 'signup' ? 'Создать аккаунт' : 'Войти';
      }
    }

    // --- ПЕРЕТАСКИВАНИЕ УРОКОВ ---
    function attachDragHandlers() {
      document.querySelectorAll('#lessonsList .drag-handle').forEach(handle => {
        handle.addEventListener('pointerdown', startLessonDrag);
      });
    }

    function startLessonDrag(e) {
      e.preventDefault();
      e.stopPropagation();

      const list = document.getElementById('lessonsList');
      const card = e.currentTarget.closest('.lesson-card');
      if (!card) return;

      const rect = card.getBoundingClientRect();
      const offsetY = e.clientY - rect.top;

      const placeholder = document.createElement('div');
      placeholder.className = 'drag-placeholder';
      placeholder.style.height = rect.height + 'px';

      card.style.width = rect.width + 'px';
      card.style.left = rect.left + 'px';
      card.style.top = rect.top + 'px';
      card.parentNode.insertBefore(placeholder, card);
      card.classList.add('dragging');

      const pointerId = e.pointerId;
      e.currentTarget.setPointerCapture?.(pointerId);

      function swapWithFlip(targetCard, insertBefore) {
        const siblings = [...list.querySelectorAll('.lesson-card:not(.dragging)')];
        const beforeTops = new Map(siblings.map(el => [el, el.getBoundingClientRect().top]));

        if (insertBefore) list.insertBefore(placeholder, targetCard);
        else list.insertBefore(placeholder, targetCard.nextSibling);

        siblings.forEach(el => {
          const dy = beforeTops.get(el) - el.getBoundingClientRect().top;
          if (!dy) return;
          el.style.transition = 'none';
          el.style.transform = `translate3d(0, ${dy}px, 0)`;
          el.offsetHeight;
          el.style.transition = 'transform 0.2s var(--ease-ios)';
          el.style.transform = 'translate3d(0, 0, 0)';
        });
      }

      function onMove(ev) {
        const newTop = ev.clientY - offsetY;
        card.style.top = newTop + 'px';
        const cardCenter = newTop + rect.height / 2;

        const siblings = [...list.querySelectorAll('.lesson-card:not(.dragging)')];
        for (const sib of siblings) {
          const r = sib.getBoundingClientRect();
          const mid = r.top + r.height / 2;
          const isBefore = placeholder.compareDocumentPosition(sib) & Node.DOCUMENT_POSITION_FOLLOWING;

          if (isBefore && cardCenter > mid) {
            swapWithFlip(sib, false);
            break;
          } else if (!isBefore && cardCenter < mid) {
            swapWithFlip(sib, true);
            break;
          }
        }
      }

      async function onUp() {
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        window.removeEventListener('pointercancel', onUp);

        suppressNextClick = true;
        setTimeout(() => { suppressNextClick = false; }, 120);

        list.insertBefore(card, placeholder);
        placeholder.remove();

        card.classList.remove('dragging');
        card.style.width = '';
        card.style.left = '';
        card.style.top = '';

        list.querySelectorAll('.lesson-card').forEach(el => {
          el.style.transition = '';
          el.style.transform = '';
        });

        await applyDraggedOrder();
      }

      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onUp);
    }

    async function applyDraggedOrder() {
      const list = document.getElementById('lessonsList');
      const orderedIds = [...list.querySelectorAll('.lesson-card')].map(el => Number(el.dataset.lessonId));
      const dayLessons = lessonsCache
        .filter(l => l.day_of_week === selectedDay)
        .sort((a, b) => a.lesson_number - b.lesson_number || a.id - b.id);

      const originalIds = dayLessons.map(l => l.id);
      if (JSON.stringify(orderedIds) === JSON.stringify(originalIds)) return;

      const slotNumbers = dayLessons.map(l => l.lesson_number).sort((a, b) => a - b);
      const updates = [];

      orderedIds.forEach((id, idx) => {
        const lesson = lessonsCache.find(l => l.id === id);
        const newNum = slotNumbers[idx];
        if (!lesson || lesson.lesson_number === newNum) return;

        const newTime = LESSON_TIMES[newNum] || lesson.lesson_time;
        lesson.lesson_number = newNum;
        lesson.lesson_time = newTime;
        updates.push({ id, lesson_number: newNum, lesson_time: newTime });
      });

      if (!updates.length) return;
      renderLessons();

      const results = await Promise.all(
        updates.map(u => db.from('lessons').update({
          lesson_number: u.lesson_number,
          lesson_time: u.lesson_time
        }).eq('id', u.id))
      );

      const err = results.find(r => r.error)?.error;
      if (err) {
        alert('Не удалось сохранить новый порядок: ' + err.message);
        await loadHwData();
      }
    }

    async function toggleDone(lessonId) {
      const wasDone = completedSet.has(lessonId);
      const card = document.querySelector(`.lesson-card[data-lesson-id="${lessonId}"]`);
      const checkBtn = card?.querySelector('.check-btn');

      if (wasDone) {
        completedSet.delete(lessonId);
        card?.classList.remove('done');
        if (checkBtn) { checkBtn.classList.remove('checked'); checkBtn.innerHTML = ''; }
        await db.from('user_completions').delete().eq('user_id', currentUser.id).eq('lesson_id', lessonId);
      } else {
        completedSet.add(lessonId);
        card?.classList.add('done');
        if (checkBtn) { checkBtn.classList.add('checked'); checkBtn.innerHTML = ICON.check; }
        await db.from('user_completions').upsert({ user_id: currentUser.id, lesson_id: lessonId, completed: true });
      }
    }

    // --- АВТОПОДБОР УЧИТЕЛЯ ---
    function normSubj(str) {
      return String(str || '')
        .toLowerCase()
        .replace(/ё/g, 'е')
        .replace(/[.,—–\-]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function findTeacherForSubject(rawSubject) {
      const q = normSubj(rawSubject);
      if (q.length < 2) return null;

      for (const rule of TEACHER_RULES) {
        if (rule.keys.includes(q)) return rule.teacher;
      }
      for (const rule of TEACHER_RULES) {
        if (rule.keys.some(k => k.startsWith(q) || q.startsWith(k))) {
          return rule.teacher;
        }
      }

      for (const l of lessonsCache) {
        if (!l.subject || !l.teacher || isWindowLesson(l)) continue;
        const s = normSubj(l.subject);
        if (s === q || (q.length >= 3 && s.startsWith(q))) {
          return l.teacher.trim();
        }
      }

      return null;
    }

    function autoFillTeacher(subjectValue) {
      const teacherInput = document.getElementById('edTeacher');
      if (!teacherInput) return;
      const found = findTeacherForSubject(subjectValue);
      if (found) teacherInput.value = found;
    }

              ${meta ? `<div style="font-size:13px; color:var(--muted); margin-top:4px;">${meta}</div>` : ''}
              ${l.is_cancelled ? '<span class="badge red" style="margin-top:6px;">Урока не будет</span>' : ''}
            </div>
            <button class="close-x" onclick="closeModal()">${ICON.close}</button>
          </div>
          <div class="hw-box">${l.homework ? linkifyText(l.homework) : '<span style="color:var(--muted)">Домашнее задание не задано</span>'}</div>
          ${photos ? `<div class="photo-grid">${photos}</div>` : ''}
        `;
        openModal();
        return;
      }

      const isWin = l ? isWindowLesson(l) : false;
      editorType = isWin ? 'window' : 'lesson';
      editingPhotos = l ? [...(l.photo_urls || [])] : [];
      pendingFiles = [];

      const dayVal = l ? l.day_of_week : selectedDay;
      const dayLessons = lessonsCache.filter(x => x.day_of_week === dayVal);
      const maxNum = dayLessons.length ? Math.max(...dayLessons.map(x => x.lesson_number)) : 0;
      const numVal = l ? l.lesson_number : maxNum + 1;
      const timeVal = l ? l.lesson_time : (LESSON_TIMES[numVal] || '');
      const idArg = l ? l.id : 'null';

      document.getElementById('modalContent').innerHTML = `
        <div class="modal-head">
          <h3>${l ? (isWin ? 'Окно в расписании' : 'Урок и ДЗ') : 'Добавить в расписание'}</h3>
          <button class="close-x" onclick="closeModal()">${ICON.close}</button>
        </div>
        <div class="stack">
          <div class="segmented" style="--cols:2;">
            <div class="seg-slider" id="editorTypeSlider" style="--idx:${isWin ? 1 : 0};"></div>
            <button type="button" id="edTypeLesson" class="${!isWin ? 'active' : ''}" onclick="switchEditorType('lesson')">Урок</button>
            <button type="button" id="edTypeWindow" class="${isWin ? 'active' : ''}" onclick="switchEditorType('window')">Окно (нет урока)</button>
          </div>

          <div class="row">
            <div class="field" style="flex:1;">
              <label>День недели</label>
              <select id="edDay">
                ${DAYS.map(d => `<option value="${d.id}" ${d.id === dayVal ? 'selected' : ''}>${d.full}</option>`).join('')}
              </select>
            </div>
            <div class="field" style="width:88px;">
              <label>Урок №</label>
              <input id="edNum" type="number" min="1" max="12" value="${numVal}" oninput="autoFillTime(this.value)" />
            </div>
          </div>

          <div id="subjFieldWrap" class="field">
            <label>Предмет</label>
            <input id="edSubj" list="subjectSuggestions" type="text"
              value="${l && !isWin ? esc(l.subject) : ''}"
              placeholder="Начните вводить предмет..." />
          </div>

          <div class="row">
            <div id="teacherFieldWrap" class="field" style="flex:1;">
              <label>Учитель</label>
              <input id="edTeacher" list="teacherSuggestions" type="text"
                value="${l && !isWin ? esc(l.teacher) : ''}"
                placeholder="Подбирается автоматически" />
            </div>
            <div class="field" style="flex:1; min-width:130px;">
              <label>Время</label>
              <input id="edTime" type="text" value="${esc(timeVal)}" placeholder="08:15 - 08:55" />
            </div>
          </div>

          <div class="field">
            <label id="hwLabel">Домашнее задание</label>
            <textarea id="edHw" placeholder="Что задали...">${l ? esc(l.homework) : ''}</textarea>
          </div>

          <label id="cancelFieldWrap" class="toggle-row">
            <input id="edCancel" type="checkbox" ${l?.is_cancelled ? 'checked' : ''} />
            <span>Урока не будет (отменён)</span>
          </label>

          <div id="photosFieldWrap" class="field">
            <label>Фотографии к ДЗ (сжимаются автоматически)</label>
            <div id="edPhotoGrid" class="photo-grid"></div>
            <label class="upload-zone">
              ${ICON.photo}
              <span>Добавить фотографии</span>
              <input id="edPhotoFile" type="file" accept="image/*" multiple class="hidden" onchange="handleNewPhotos(this.files)" />
            </label>
          </div>

          <div id="edMsg" class="msg"></div>

          <div class="row" style="justify-content: space-between; margin-top:4px;">
            ${l ? `<button class="btn danger sm" onclick="deleteLesson(${l.id})">${ICON.trash}<span>Удалить</span></button>` : '<span></span>'}
            <div class="row" style="gap:6px;">
              <button class="btn secondary sm" onclick="closeModal()">Отмена</button>
              <button id="saveLessonBtn" class="btn sm" onclick="saveLesson(${idArg})">Сохранить</button>
            </div>
          </div>
        </div>
      `;

      const subjInput = document.getElementById('edSubj');
      const triggerTeacher = () => autoFillTeacher(subjInput.value);
      subjInput.addEventListener('input', triggerTeacher);
      subjInput.addEventListener('change', triggerTeacher);
      subjInput.addEventListener('keyup', triggerTeacher);
      subjInput.addEventListener('blur', triggerTeacher);

      switchEditorType(editorType);
      renderEditingPhotos();
      openModal();
    }

    function autoFillTime(num) {
      const timeInput = document.getElementById('edTime');
      if (timeInput && LESSON_TIMES[num]) timeInput.value = LESSON_TIMES[num];
    }

    function handleNewPhotos(fileList) {
      for (const file of fileList) {
        pendingFiles.push({ file, preview: URL.createObjectURL(file) });
      }
      renderEditingPhotos();
    }

    function renderEditingPhotos() {
      const grid = document.getElementById('edPhotoGrid');
      if (!grid) return;
      const savedHtml = editingPhotos.map((url, idx) => `
        <div class="photo-item">
          <img src="${esc(url)}" onclick="openLightbox('${esc(url)}')" />
          <button class="photo-del" onclick="editingPhotos.splice(${idx},1); renderEditingPhotos();">${ICON.close}</button>
        </div>
      `).join('');
      const pendingHtml = pendingFiles.map((item, idx) => `
        <div class="photo-item">
          <img src="${item.preview}" onclick="openLightbox('${item.preview}')" />
          <button class="photo-del" onclick="pendingFiles.splice(${idx},1); renderEditingPhotos();">${ICON.close}</button>
        </div>
      `).join('');
      grid.innerHTML = savedHtml + pendingHtml;
    }

    async function saveLesson(lessonId) {
      const btn = document.getElementById('saveLessonBtn');
      const msg = document.getElementById('edMsg');
      msg.textContent = '';

      const day_of_week = parseInt(document.getElementById('edDay').value, 10);
      const lesson_number = parseInt(document.getElementById('edNum').value, 10) || 1;
      const lesson_time = document.getElementById('edTime').value.trim();
      const homework = document.getElementById('edHw').value.trim();

      let payload;

      if (editorType === 'window') {
        payload = {
          day_of_week,
          lesson_number,
          subject: 'Нет урока',
          teacher: '',
          lesson_time,
          homework,
          is_cancelled: false,
          photo_urls: []
        };
      } else {
        const subject = document.getElementById('edSubj').value.trim();
        let teacher = document.getElementById('edTeacher').value.trim();
        const is_cancelled = document.getElementById('edCancel').checked;

        if (!subject) { msg.textContent = 'Введите название предмета'; return; }
        if (!teacher) teacher = findTeacherForSubject(subject) || '';

        btn.disabled = true;
        btn.textContent = pendingFiles.length ? 'Сжатие фото...' : 'Сохранение...';

        try {
          for (const item of pendingFiles) {
            const compressed = await compressImage(item.file, 1280, 0.78);
            const path = `${Date.now()}_${Math.random().toString(36).slice(2)}.jpg`;
            const { error: upErr } = await db.storage.from('diary-photos').upload(path, compressed, {
              contentType: 'image/jpeg'
            });
            if (upErr) throw upErr;
            const { data: pub } = db.storage.from('diary-photos').getPublicUrl(path);
            editingPhotos.push(pub.publicUrl);
          }
        } catch (err) {
          msg.textContent = err.message;
          btn.disabled = false;
          btn.textContent = 'Сохранить';
          return;
        }

        payload = { day_of_week, lesson_number, subject, teacher, lesson_time, homework, is_cancelled, photo_urls: editingPhotos };
      }

      btn.disabled = true;
      btn.textContent = 'Сохранение...';

      try {
        const { error } = lessonId
          ? await db.from('lessons').update(payload).eq('id', lessonId)
          : await db.from('lessons').insert([payload]);

        if (error) throw error;

        selectedDay = day_of_week;
        closeModal();
        updateDaysUI();
        await loadHwData();
      } catch (err) {
        msg.textContent = err.message;
        btn.disabled = false;
        btn.textContent = 'Сохранить';
      }
    }

    async function deleteLesson(lessonId) {
      if (!confirm('Удалить эту запись из расписания?')) return;
      const { error } = await db.from('lessons').delete().eq('id', lessonId);
      if (error) { alert('Не удалось удалить: ' + error.message); return; }
      closeModal();
      await loadHwData();
    }

    function openModal() {
      document.getElementById('modalBackdrop').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modalBackdrop').classList.remove('open');
    }

    function openLightbox(url) {
      document.getElementById('lightboxImg').src = url;
      document.getElementById('lightbox').classList.add('open');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }

    // --- УЧАСТНИКИ ---
    async function loadMembers(silent = false) {
      const { data, error } = await db.from('profiles').select('*').order('created_at', { ascending: true });
      const list = document.getElementById('membersList');
      if (error) {
        if (!silent) list.innerHTML = `<div class="empty">${esc(error.message)}</div>`;
        return;
      }

      const order = { super_admin: 0, admin: 1, user: 2 };
      data.sort((a, b) => (order[a.role] ?? 2) - (order[b.role] ?? 2));

      if (silent && JSON.stringify(data) === JSON.stringify(membersCache)) return;
      membersCache = data;
      renderMembers();
    }

    function renderMembers() {
      const list = document.getElementById('membersList');
      const labels = {
        super_admin: '<span class="badge orange">Главный админ</span>',
        admin: '<span class="badge blue">Админ</span>',
        user: '<span class="badge gray">Ученик</span>'
      };

      list.innerHTML = membersCache.map(u => {
        const canManage = isSuperAdmin() && u.role !== 'super_admin' && u.id !== currentUser.id;
        const name = safeFullName(u);
        const avatarHtml = u.avatar_url
          ? `<img src="${esc(u.avatar_url)}" alt="" />`
          : name[0].toUpperCase();

        return `
          <div class="member-card">
            <div class="member-info">
              <div class="avatar" style="width:36px; height:36px; font-size:14px;">${avatarHtml}</div>
              <div>
                <div class="member-name">${esc(name)} ${labels[u.role] || labels.user}</div>
                <div class="member-email">${esc(u.email || '')}</div>
              </div>
            </div>
            ${canManage ? `
              <button class="btn sm ${u.role === 'admin' ? 'danger' : 'secondary'}" style="font-size:12px; padding:6px 10px;"
                onclick="toggleAdminRole('${u.id}', '${u.role === 'admin' ? 'user' : 'admin'}')">
                ${u.role === 'admin' ? 'Снять' : 'Админ'}
              </button>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    async function toggleAdminRole(userId, newRole) {
      const { error } = await db.from('profiles').update({ role: newRole }).eq('id', userId);
      if (error) alert('Ошибка: ' + error.message);
      else await loadMembers();
    }
  </script>
</body>
</html>
