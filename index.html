<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diary — Дневник класса</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f2f2f7;
      --surface: rgba(255, 255, 255, 0.85);
      --surface-solid: #ffffff;
      --topbar: rgba(242, 242, 247, 0.82);
      --input-bg: #ffffff;
      --subtle-bg: rgba(118, 118, 128, 0.12);
      --text: #1c1c1e;
      --muted: #6e6e73;
      --border: rgba(60, 60, 67, 0.13);
      --accent: #007aff;
      --accent-hover: #0062cc;
      --green: #34c759;
      --red: #ff3b30;
      --orange: #ff9500;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      --radius: 16px;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #000000;
        --surface: rgba(28, 28, 30, 0.86);
        --surface-solid: #1c1c1e;
        --topbar: rgba(20, 20, 22, 0.82);
        --input-bg: #2c2c2e;
        --subtle-bg: rgba(118, 118, 128, 0.24);
        --text: #f5f5f7;
        --muted: #98989d;
        --border: rgba(255, 255, 255, 0.12);
        --accent: #0a84ff;
        --accent-hover: #409cff;
        --green: #30d158;
        --red: #ff453a;
        --orange: #ff9f0a;
        --shadow: 0 10px 34px rgba(0, 0, 0, 0.45);
      }
    }

    :root[data-theme="dark"] {
      --bg: #000000;
      --surface: rgba(28, 28, 30, 0.86);
      --surface-solid: #1c1c1e;
      --topbar: rgba(20, 20, 22, 0.82);
      --input-bg: #2c2c2e;
      --subtle-bg: rgba(118, 118, 128, 0.24);
      --text: #f5f5f7;
      --muted: #98989d;
      --border: rgba(255, 255, 255, 0.12);
      --accent: #0a84ff;
      --accent-hover: #409cff;
      --green: #30d158;
      --red: #ff453a;
      --orange: #ff9f0a;
      --shadow: 0 10px 34px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .hidden { display: none !important; }

    /* Auth */
    .auth-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 390px;
      background: var(--surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 28px;
      box-shadow: var(--shadow);
    }
    .auth-card h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -0.4px; }
    .auth-card p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }

    /* Header */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--topbar);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      max-width: 780px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand { font-size: 20px; font-weight: 700; letter-spacing: -0.4px; }
    .segmented {
      display: inline-flex;
      background: var(--subtle-bg);
      padding: 3px;
      border-radius: 12px;
      gap: 2px;
    }
    .segmented button {
      background: transparent;
      color: var(--muted);
      border: none;
      padding: 7px 14px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.16s ease;
    }
    .segmented button.active {
      background: var(--surface-solid);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    .profile-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--subtle-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 11px 5px 6px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }
    .profile-pill:hover { opacity: 0.85; }
    .avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
      padding: 18px 16px 70px;
    }

    /* Days Tabs */
    .days-bar {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      background: var(--subtle-bg);
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 18px;
    }
    .day-btn {
      border: none;
      background: transparent;
      padding: 9px 4px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: 0.15s;
    }
    .day-btn.active {
      background: var(--surface-solid);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .section-head h2 { margin: 0; font-size: 21px; letter-spacing: -0.3px; }

    /* Form Controls */
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 13px; font-weight: 600; color: var(--muted); }
    input, textarea, select {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--input-bg);
      font-size: 15px;
      font-family: inherit;
      color: var(--text);
      outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 92px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 16px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      transition: 0.15s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn.secondary { background: var(--subtle-bg); color: var(--text); }
    .btn.secondary:hover { opacity: 0.85; }
    .btn.danger { background: rgba(255, 59, 48, 0.14); color: var(--red); }
    .btn.danger:hover { background: rgba(255, 59, 48, 0.22); }
    .btn.sm { padding: 7px 13px; font-size: 13px; border-radius: 10px; }

    .stack { display: flex; flex-direction: column; gap: 12px; }
    .row { display: flex; gap: 10px; align-items: center; }

    /* Lesson Cards */
    .lesson-list { display: flex; flex-direction: column; gap: 10px; }
    .lesson-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.15s ease;
    }
    .lesson-card:hover {
      box-shadow: var(--shadow);
      transform: translateY(-1px);
    }
    .lesson-card.cancelled {
      background: rgba(255, 59, 48, 0.08);
      border-color: rgba(255, 59, 48, 0.28);
    }
    .lesson-card.done .lesson-title {
      text-decoration: line-through;
      color: var(--muted);
    }

    .check-btn {
      width: 24px;
      height: 24px;
      min-width: 24px;
      border-radius: 50%;
      border: 2px solid var(--muted);
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      color: #fff;
      font-size: 13px;
      transition: 0.15s;
    }
    .check-btn.checked { background: var(--green); border-color: var(--green); }

    .lesson-num {
      width: 28px;
      height: 28px;
      min-width: 28px;
      border-radius: 9px;
      background: rgba(0, 122, 255, 0.14);
      color: var(--accent);
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lesson-card.cancelled .lesson-num {
      background: rgba(255, 59, 48, 0.16);
      color: var(--red);
    }
    .lesson-info { flex: 1; min-width: 0; }
    .lesson-title {
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .lesson-preview {
      margin-top: 3px;
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Badges */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge.red { background: rgba(255, 59, 48, 0.16); color: var(--red); }
    .badge.blue { background: rgba(0, 122, 255, 0.16); color: var(--accent); }
    .badge.orange { background: rgba(255, 149, 0, 0.18); color: var(--orange); }
    .badge.gray { background: var(--subtle-bg); color: var(--muted); }

    /* Members */
    .member-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
    }
    .member-name { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .member-email { font-size: 13px; color: var(--muted); margin-top: 2px; }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal {
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      background: var(--surface-solid);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
    }
    .modal-head h3 { margin: 0; font-size: 20px; }
    .close-x {
      background: var(--subtle-bg);
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 15px;
      color: var(--text);
    }
    .hw-box {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      margin-bottom: 14px;
    }

    /* Photo upload & grid */
    .upload-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 16px;
      border: 1.5px dashed var(--border);
      border-radius: 14px;
      background: var(--bg);
      color: var(--muted);
      font-size: 14px;
      cursor: pointer;
      text-align: center;
      transition: 0.15s;
    }
    .upload-zone:hover { border-color: var(--accent); color: var(--accent); }
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }
    .photo-item {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 1;
      background: var(--subtle-bg);
    }
    .photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: zoom-in;
      display: block;
    }
    .photo-del {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: none;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      cursor: pointer;
      font-size: 12px;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(0, 0, 0, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      cursor: zoom-out;
    }
    .lightbox img { max-width: 100%; max-height: 92vh; border-radius: 12px; }

    .empty {
      text-align: center;
      padding: 42px 16px;
      color: var(--muted);
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .msg { font-size: 13px; color: var(--red); min-height: 18px; }
    .msg.ok { color: var(--green); }
    .toggle-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    .toggle-row input { width: auto; accent-color: var(--red); }

    @media (max-width: 520px) {
      .profile-name-text { display: none; }
      .profile-pill { padding: 4px; }
    }
  </style>
</head>
<body>

  <!-- АВТОРИЗАЦИЯ -->
  <div id="authView" class="auth-wrap">
    <div class="auth-card stack">
      <h1>Diary</h1>
      <p>Школьное расписание, ДЗ и фото</p>
      <input id="nameInput" type="text" placeholder="Имя и фамилия (для регистрации)" />
      <input id="emailInput" type="email" placeholder="Email" />
      <input id="passInput" type="password" placeholder="Пароль (от 6 символов)" />
      <div class="row">
        <button class="btn" style="flex:1" onclick="signIn()">Войти</button>
        <button class="btn secondary" style="flex:1" onclick="signUp()">Регистрация</button>
      </div>
      <div id="authMsg" class="msg"></div>
    </div>
  </div>

  <!-- ПРИЛОЖЕНИЕ -->
  <div id="appView" class="hidden">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">Diary</div>
        <div class="segmented">
          <button id="navHw" class="active" onclick="switchPage('hw')">ДЗ</button>
          <button id="navMembers" onclick="switchPage('members')">Участники</button>
        </div>
        <button class="profile-pill" onclick="openProfileSettings()" title="Настройки профиля">
          <span id="headerAvatar" class="avatar">?</span>
          <span id="headerName" class="profile-name-text">Профиль</span>
        </button>
      </div>
    </header>

    <main class="container">
      <!-- СТРАНИЦА ДЗ -->
      <section id="pageHw">
        <div class="days-bar" id="daysBar"></div>
        <div class="section-head">
          <h2 id="dayTitle">Понедельник</h2>
          <button id="addLessonBtn" class="btn sm hidden" onclick="openEditor(null)">+ Добавить урок</button>
        </div>
        <div id="lessonsList" class="lesson-list"></div>
      </section>

      <!-- СТРАНИЦА УЧАСТНИКИ -->
      <section id="pageMembers" class="hidden">
        <div class="section-head">
          <h2>Участники</h2>
          <span id="myRoleBadge" class="badge gray"></span>
        </div>
        <div id="membersList" class="stack"></div>
      </section>
    </main>
  </div>

  <!-- ОБЩЕЕ МОДАЛЬНОЕ ОКНО -->
  <div id="modalBackdrop" class="modal-backdrop hidden" onclick="if(event.target===this) closeModal()">
    <div class="modal" id="modalContent"></div>
  </div>

  <!-- ПРОСМОТР ФОТО -->
  <div id="lightbox" class="lightbox hidden" onclick="this.classList.add('hidden')">
    <img id="lightboxImg" src="" alt="Фото ДЗ" />
  </div>

  <!-- ПОДСКАЗКИ ПРЕДМЕТОВ -->
  <datalist id="subjectSuggestions">
    <option value="Алгебра"></option>
    <option value="Геометрия"></option>
    <option value="Физика"></option>
    <option value="Химия"></option>
    <option value="Биология"></option>
    <option value="Информатика"></option>
    <option value="Русский язык"></option>
    <option value="Литература"></option>
    <option value="Английский язык"></option>
    <option value="История"></option>
    <option value="Обществознание"></option>
    <option value="География"></option>
    <option value="Физкультура"></option>
  </datalist>

  <script>
    const SUPABASE_URL = 'https://cvjobvwcnuiplvwmvewv.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_IUujdNZtYjJNoGhrtgabHQ_70qDfFys';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const DAYS = [
      { id: 1, short: 'Пн', full: 'Понедельник' },
      { id: 2, short: 'Вт', full: 'Вторник' },
      { id: 3, short: 'Ср', full: 'Среда' },
      { id: 4, short: 'Чт', full: 'Четверг' },
      { id: 5, short: 'Пт', full: 'Пятница' },
      { id: 6, short: 'Сб', full: 'Суббота' }
    ];

    let currentUser = null;
    let currentProfile = null;
    let currentPage = 'hw';
    let selectedDay = Math.min(Math.max(new Date().getDay(), 1), 6);
    let lessonsCache = [];
    let completedSet = new Set();

    // --- ТЕМА (Авто / Светлая / Темная) ---
    function applyTheme(theme) {
      const val = theme || 'auto';
      localStorage.setItem('diary_theme', val);
      if (val === 'auto') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', val);
    }
    applyTheme(localStorage.getItem('diary_theme') || 'auto');

    const isAdmin = () => currentProfile && (currentProfile.role === 'admin' || currentProfile.role === 'super_admin');
    const isSuperAdmin = () => currentProfile && currentProfile.role === 'super_admin';

    function esc(str = '') {
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    // --- AUTH ---
    db.auth.onAuthStateChange(async (event, session) => {
      if (session?.user) {
        currentUser = session.user;
        await loadMyProfile();
        document.getElementById('authView').classList.add('hidden');
        document.getElementById('appView').classList.remove('hidden');
        renderDays();
        await loadHwData();
        if (currentPage === 'members') await loadMembers();
      } else {
        currentUser = null;
        currentProfile = null;
        document.getElementById('appView').classList.add('hidden');
        document.getElementById('authView').classList.remove('hidden');
      }
    });

    async function signUp() {
      const msg = document.getElementById('authMsg');
      msg.textContent = '';
      const fullName = document.getElementById('nameInput').value.trim();
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passInput').value;
      if (!fullName) { msg.textContent = 'Введите имя для регистрации'; return; }

      const { error } = await db.auth.signUp({
        email, password,
        options: { data: { full_name: fullName } }
      });
      if (error) msg.textContent = error.message;
      else msg.textContent = 'Аккаунт создан! Если включено подтверждение почты — проверьте email.';
    }

    async function signIn() {
      const msg = document.getElementById('authMsg');
      msg.textContent = '';
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passInput').value;
      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) msg.textContent = error.message;
    }

    async function signOut() {
      closeModal();
      await db.auth.signOut();
    }

    async function loadMyProfile() {
      const { data } = await db.from('profiles').select('*').eq('id', currentUser.id).single();
      currentProfile = data || { id: currentUser.id, email: currentUser.email, full_name: currentUser.email, role: 'user' };
      document.getElementById('addLessonBtn').classList.toggle('hidden', !isAdmin());

      const shortName = currentProfile.full_name.split(' ')[0] || 'Профиль';
      document.getElementById('headerName').textContent = shortName;
      document.getElementById('headerAvatar').textContent = shortName[0].toUpperCase();

      const roleLabels = { super_admin: 'Главный админ', admin: 'Админ', user: 'Ученик' };
      const badge = document.getElementById('myRoleBadge');
      badge.textContent = 'Вы: ' + roleLabels[currentProfile.role];
      badge.className = 'badge ' + (currentProfile.role === 'super_admin' ? 'orange' : currentProfile.role === 'admin' ? 'blue' : 'gray');
    }

    // --- НАСТРОЙКИ ПРОФИЛЯ ---
    function openProfileSettings() {
      const currentTheme = localStorage.getItem('diary_theme') || 'auto';
      const roleLabels = { super_admin: 'Главный админ', admin: 'Админ', user: 'Ученик' };

      document.getElementById('modalContent').innerHTML = `
        <div class="modal-head">
          <h3>Настройки профиля</h3>
          <button class="close-x" onclick="closeModal()">✕</button>
        </div>
        <div class="stack">
          <div class="row" style="justify-content:space-between; padding:12px 14px; background:var(--bg); border-radius:12px;">
            <div>
              <div style="font-weight:600;">${esc(currentProfile.email)}</div>
              <div style="font-size:12px; color:var(--muted);">Роль: ${roleLabels[currentProfile.role]}</div>
            </div>
            <span class="badge ${currentProfile.role === 'super_admin' ? 'orange' : currentProfile.role === 'admin' ? 'blue' : 'gray'}">
              ${roleLabels[currentProfile.role]}
            </span>
          </div>

          <div class="field">
            <label>Имя и фамилия</label>
            <input id="profNameInput" type="text" value="${esc(currentProfile.full_name)}" placeholder="Ваше имя" />
          </div>

          <div class="field">
            <label>Тема оформления</label>
            <div class="segmented" style="width:100%; display:grid; grid-template-columns:repeat(3,1fr);">
              <button class="${currentTheme === 'auto' ? 'active' : ''}" onclick="setThemeFromModal('auto')">Авто</button>
              <button class="${currentTheme === 'light' ? 'active' : ''}" onclick="setThemeFromModal('light')">Светлая</button>
              <button class="${currentTheme === 'dark' ? 'active' : ''}" onclick="setThemeFromModal('dark')">Тёмная</button>
            </div>
          </div>

          <div id="profMsg" class="msg"></div>

          <div class="row" style="justify-content:space-between; margin-top:6px;">
            <button class="btn danger" onclick="signOut()">Выйти из аккаунта</button>
            <button class="btn" onclick="saveProfileName()">Сохранить имя</button>
          </div>
        </div>
      `;
      document.getElementById('modalBackdrop').classList.remove('hidden');
    }

    function setThemeFromModal(theme) {
      applyTheme(theme);
      openProfileSettings();
    }

    async function saveProfileName() {
      const msg = document.getElementById('profMsg');
      msg.className = 'msg';
      msg.textContent = '';
      const newName = document.getElementById('profNameInput').value.trim();
      if (!newName) { msg.textContent = 'Имя не может быть пустым'; return; }

      const { error } = await db.from('profiles').update({ full_name: newName }).eq('id', currentUser.id);
      if (error) { msg.textContent = error.message; return; }

      await loadMyProfile();
      if (currentPage === 'members') await loadMembers();
      msg.className = 'msg ok';
      msg.textContent = 'Имя сохранено!';
    }

    // --- НАВИГАЦИЯ ---
    function switchPage(page) {
      currentPage = page;
      document.getElementById('pageHw').classList.toggle('hidden', page !== 'hw');
      document.getElementById('pageMembers').classList.toggle('hidden', page !== 'members');
      document.getElementById('navHw').classList.toggle('active', page === 'hw');
      document.getElementById('navMembers').classList.toggle('active', page === 'members');
      if (page === 'hw') loadHwData();
      else loadMembers();
    }

    function renderDays() {
      document.getElementById('daysBar').innerHTML = DAYS.map(d => `
        <button class="day-btn ${d.id === selectedDay ? 'active' : ''}" onclick="selectDay(${d.id})">${d.short}</button>
      `).join('');
      document.getElementById('dayTitle').textContent = DAYS.find(d => d.id === selectedDay).full;
    }

    function selectDay(dayId) {
      selectedDay = dayId;
      renderDays();
      renderLessons();
    }

    // --- УРОКИ И ДЗ ---
    async function loadHwData() {
      const [lessonsRes, compRes] = await Promise.all([
        db.from('lessons').select('*').order('lesson_number', { ascending: true }).order('id', { ascending: true }),
        db.from('user_completions').select('lesson_id').eq('user_id', currentUser.id).eq('completed', true)
      ]);
      lessonsCache = lessonsRes.data || [];
      completedSet = new Set((compRes.data || []).map(r => r.lesson_id));
      renderLessons();
    }

    function renderLessons() {
      const list = document.getElementById('lessonsList');
      const dayLessons = lessonsCache.filter(l => l.day_of_week === selectedDay);

      if (!dayLessons.length) {
        list.innerHTML = `
          <div class="empty">
            <div>На этот день уроков пока нет</div>
            ${isAdmin() ? `<button class="btn sm" onclick="openEditor(null)">+ Добавить первый урок</button>` : ''}
          </div>
        `;
        return;
      }

      list.innerHTML = dayLessons.map(l => {
        const done = completedSet.has(l.id);
        const photosCount = (l.photo_urls || []).length;
        const preview = l.is_cancelled ? 'Занятие отменено' : (l.homework || 'ДЗ не задано');

        return `
          <div class="lesson-card ${l.is_cancelled ? 'cancelled' : ''} ${done ? 'done' : ''}" onclick="openLessonView(${l.id})">
            <button class="check-btn ${done ? 'checked' : ''}" title="Отметить выполненным у себя"
              onclick="event.stopPropagation(); toggleDone(${l.id})">${done ? '✓' : ''}</button>
            <div class="lesson-num">${l.lesson_number}</div>
            <div class="lesson-info">
              <div class="lesson-title">
                <span>${esc(l.subject)}</span>
                ${l.is_cancelled ? '<span class="badge red">Урока не будет</span>' : ''}
                ${photosCount ? `<span class="badge blue">📷 ${photosCount}</span>` : ''}
              </div>
              <div class="lesson-preview">${esc(preview)}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function toggleDone(lessonId) {
      const wasDone = completedSet.has(lessonId);
      if (wasDone) {
        completedSet.delete(lessonId);
        renderLessons();
        await db.from('user_completions').delete().eq('user_id', currentUser.id).eq('lesson_id', lessonId);
      } else {
        completedSet.add(lessonId);
        renderLessons();
        await db.from('user_completions').upsert({ user_id: currentUser.id, lesson_id: lessonId, completed: true });
      }
    }

    function openLessonView(lessonId) {
      const l = lessonsCache.find(x => x.id === lessonId);
      if (!l) return;

      const photos = (l.photo_urls || []).map(url => `
        <div class="photo-item">
          <img src="${esc(url)}" onclick="openLightbox('${esc(url)}')" alt="Фото ДЗ" />
        </div>
      `).join('');

      document.getElementById('modalContent').innerHTML = `
        <div class="modal-head">
          <div>
            <h3>${l.lesson_number}. ${esc(l.subject)}</h3>
            ${l.is_cancelled ? '<span class="badge red" style="margin-top:6px;">Урока не будет</span>' : ''}
          </div>
          <button class="close-x" onclick="closeModal()">✕</button>
        </div>

        <div class="hw-box">${l.homework ? esc(l.homework) : '<span style="color:var(--muted)">Домашнее задание не указано</span>'}</div>
        ${photos ? `<div class="photo-grid">${photos}</div>` : ''}

        <div class="row" style="justify-content: space-between; margin-top: 8px;">
          <button class="btn secondary" onclick="toggleDone(${l.id}); openLessonView(${l.id});">
            ${completedSet.has(l.id) ? '✓ Сделано (снять)' : 'Отметить сделанным'}
          </button>
          ${isAdmin() ? `<button class="btn" onclick="openEditor(${l.id})">Редактировать</button>` : ''}
        </div>
      `;
      document.getElementById('modalBackdrop').classList.remove('hidden');
    }

    // --- УДОБНЫЙ РЕДАКТОР УРОКОВ (АДМИНЫ) ---
    let editingPhotos = [];
    let pendingFiles = [];

    function openEditor(lessonId) {
      const l = lessonId ? lessonsCache.find(x => x.id === lessonId) : null;
      editingPhotos = l ? [...(l.photo_urls || [])] : [];
      pendingFiles = [];
      const dayVal = l ? l.day_of_week : selectedDay;
      const nextNum = lessonsCache.filter(x => x.day_of_week === dayVal).length + 1;

      document.getElementById('modalContent').innerHTML = `
        <div class="modal-head">
          <h3>${l ? 'Редактировать урок' : 'Новый урок'}</h3>
          <button class="close-x" onclick="closeModal()">✕</button>
        </div>
        <div class="stack">
          <div class="row">
            <div class="field" style="flex:1;">
              <label>День недели</label>
              <select id="edDay">
                ${DAYS.map(d => `<option value="${d.id}" ${d.id === dayVal ? 'selected' : ''}>${d.full}</option>`).join('')}
              </select>
            </div>
            <div class="field" style="width:105px;">
              <label>№ урока</label>
              <input id="edNum" type="number" min="1" max="12" value="${l ? l.lesson_number : nextNum}" />
            </div>
          </div>

          <div class="field">
            <label>Предмет</label>
            <input id="edSubj" list="subjectSuggestions" type="text" value="${l ? esc(l.subject) : ''}" placeholder="Выберите или введите предмет..." />
          </div>

          <div class="field">
            <label>Домашнее задание</label>
            <textarea id="edHw" placeholder="Например: §14, упр. 125–128">${l ? esc(l.homework) : ''}</textarea>
          </div>

          <label class="toggle-row">
            <input id="edCancel" type="checkbox" ${l?.is_cancelled ? 'checked' : ''} />
            <span>Урока не будет (отменить занятие)</span>
          </label>

          <div class="field">
            <label>Фотографии к ДЗ</label>
            <div id="edPhotoGrid" class="photo-grid"></div>
            <label class="upload-zone">
              <strong>+ Выбрать фотографии</strong>
              <span style="font-size:12px;">Можно выбрать сразу несколько</span>
              <input id="edPhotoFile" type="file" accept="image/*" multiple class="hidden" onchange="handleNewPhotos(this.files)" />
            </label>
          </div>

          <div id="edMsg" class="msg"></div>

          <div class="row" style="justify-content: space-between; margin-top:6px;">
            ${l ? `<button class="btn danger" onclick="deleteLesson(${l.id})">Удалить</button>` : '<span></span>'}
            <div class="row">
              <button class="btn secondary" onclick="closeModal()">Отмена</button>
              <button id="saveLessonBtn" class="btn" onclick="saveLesson(${l ? l.id : 'null'})">Сохранить</button>
            </div>
          </div>
        </div>
      `;
      renderEditingPhotos();
      document.getElementById('modalBackdrop').classList.remove('hidden');
    }

    function handleNewPhotos(fileList) {
      for (const file of fileList) {
        pendingFiles.push({ file, preview: URL.createObjectURL(file) });
      }
      renderEditingPhotos();
    }

    function renderEditingPhotos() {
      const grid = document.getElementById('edPhotoGrid');
      if (!grid) return;
      const savedHtml = editingPhotos.map((url, idx) => `
        <div class="photo-item">
          <img src="${esc(url)}" onclick="openLightbox('${esc(url)}')" />
          <button class="photo-del" onclick="editingPhotos.splice(${idx},1); renderEditingPhotos();">✕</button>
        </div>
      `).join('');
      const pendingHtml = pendingFiles.map((item, idx) => `
        <div class="photo-item">
          <img src="${item.preview}" onclick="openLightbox('${item.preview}')" />
          <button class="photo-del" onclick="pendingFiles.splice(${idx},1); renderEditingPhotos();">✕</button>
        </div>
      `).join('');
      grid.innerHTML = savedHtml + pendingHtml;
    }

    async function saveLesson(lessonId) {
      const btn = document.getElementById('saveLessonBtn');
      const msg = document.getElementById('edMsg');
      msg.textContent = '';

      const day_of_week = parseInt(document.getElementById('edDay').value, 10);
      const lesson_number = parseInt(document.getElementById('edNum').value, 10) || 1;
      const subject = document.getElementById('edSubj').value.trim();
      const homework = document.getElementById('edHw').value.trim();
      const is_cancelled = document.getElementById('edCancel').checked;

      if (!subject) { msg.textContent = 'Введите название предмета'; return; }

      btn.disabled = true;
      btn.textContent = 'Сохранение...';

      for (const item of pendingFiles) {
        const ext = item.file.name.split('.').pop() || 'jpg';
        const path = `${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
        const { error: upErr } = await db.storage.from('diary-photos').upload(path, item.file);
        if (upErr) {
          msg.textContent = 'Ошибка загрузки фото: ' + upErr.message;
          btn.disabled = false;
          btn.textContent = 'Сохранить';
          return;
        }
        const { data: pub } = db.storage.from('diary-photos').getPublicUrl(path);
        editingPhotos.push(pub.publicUrl);
      }

      const payload = { day_of_week, lesson_number, subject, homework, is_cancelled, photo_urls: editingPhotos };
      const { error } = lessonId
        ? await db.from('lessons').update(payload).eq('id', lessonId)
        : await db.from('lessons').insert([payload]);

      if (error) {
        msg.textContent = error.message;
        btn.disabled = false;
        btn.textContent = 'Сохранить';
        return;
      }

      selectedDay = day_of_week;
      closeModal();
      renderDays();
      await loadHwData();
    }

    async function deleteLesson(lessonId) {
      if (!confirm('Удалить этот урок из расписания?')) return;
      await db.from('lessons').delete().eq('id', lessonId);
      closeModal();
      await loadHwData();
    }

    function closeModal() {
      document.getElementById('modalBackdrop').classList.add('hidden');
    }

    function openLightbox(url) {
      document.getElementById('lightboxImg').src = url;
      document.getElementById('lightbox').classList.remove('hidden');
    }

    // --- УЧАСТНИКИ ---
    async function loadMembers() {
      const { data, error } = await db.from('profiles').select('*').order('created_at', { ascending: true });
      const list = document.getElementById('membersList');
      if (error) { list.innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }

      const order = { super_admin: 0, admin: 1, user: 2 };
      data.sort((a, b) => order[a.role] - order[b.role]);

      const labels = {
        super_admin: '<span class="badge orange">Главный админ</span>',
        admin: '<span class="badge blue">Админ</span>',
        user: '<span class="badge gray">Ученик</span>'
      };

      list.innerHTML = data.map(u => {
        const canManage = isSuperAdmin() && u.role !== 'super_admin' && u.id !== currentUser.id;
        return `
          <div class="member-card">
            <div>
              <div class="member-name">${esc(u.full_name)} ${labels[u.role]}</div>
              <div class="member-email">${esc(u.email)}</div>
            </div>
            ${canManage ? `
              <button class="btn sm ${u.role === 'admin' ? 'danger' : 'secondary'}"
                onclick="toggleAdminRole('${u.id}', '${u.role === 'admin' ? 'user' : 'admin'}')">
                ${u.role === 'admin' ? 'Снять админа' : 'Сделать админом'}
              </button>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    async function toggleAdminRole(userId, newRole) {
      const { error } = await db.from('profiles').update({ role: newRole }).eq('id', userId);
      if (error) alert('Ошибка: ' + error.message);
      else await loadMembers();
    }
  </script>
</body>
</html>
