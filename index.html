<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Diary — Дневник класса</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f2f2f7;
      --surface-solid: #ffffff;
      --topbar: rgba(242, 242, 247, 0.84);
      --dock-bg: rgba(255, 255, 255, 0.86);
      --input-bg: #ffffff;
      --subtle-bg: rgba(118, 118, 128, 0.12);
      --seg-active: #ffffff;
      --cancelled-bg: rgba(255, 59, 48, 0.09);
      --window-bg: rgba(142, 142, 147, 0.14);
      --text: #1c1c1e;
      --muted: #8e8e93;
      --border: rgba(60, 60, 67, 0.12);
      --accent: #007aff;
      --accent-soft: rgba(0, 122, 255, 0.12);
      --green: #34c759;
      --red: #ff3b30;
      --orange: #ff9500;
      --card-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
      --dock-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      --drag-shadow: 0 16px 38px rgba(0, 0, 0, 0.18);
      --radius: 18px;
      --app-width: 520px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --ease-ios: cubic-bezier(0.32, 0.72, 0, 1);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #000000;
        --surface-solid: #1c1c1e;
        --topbar: rgba(18, 18, 20, 0.84);
        --dock-bg: rgba(34, 34, 38, 0.88);
        --input-bg: #2c2c2e;
        --subtle-bg: rgba(118, 118, 128, 0.24);
        --seg-active: #3a3a3c;
        --cancelled-bg: rgba(255, 69, 58, 0.14);
        --window-bg: rgba(142, 142, 147, 0.15);
        --text: #f5f5f7;
        --muted: #98989d;
        --border: rgba(255, 255, 255, 0.11);
        --accent: #0a84ff;
        --accent-soft: rgba(10, 132, 255, 0.16);
        --green: #30d158;
        --red: #ff453a;
        --orange: #ff9f0a;
        --card-shadow: none;
        --dock-shadow: 0 12px 36px rgba(0, 0, 0, 0.65);
        --drag-shadow: 0 18px 42px rgba(0, 0, 0, 0.7);
      }
    }

    :root[data-theme="dark"] {
      --bg: #000000;
      --surface-solid: #1c1c1e;
      --topbar: rgba(18, 18, 20, 0.84);
      --dock-bg: rgba(34, 34, 38, 0.88);
      --input-bg: #2c2c2e;
      --subtle-bg: rgba(118, 118, 128, 0.24);
      --seg-active: #3a3a3c;
      --cancelled-bg: rgba(255, 69, 58, 0.14);
      --window-bg: rgba(142, 142, 147, 0.15);
      --text: #f5f5f7;
      --muted: #98989d;
      --border: rgba(255, 255, 255, 0.11);
      --accent: #0a84ff;
      --accent-soft: rgba(10, 132, 255, 0.16);
      --green: #30d158;
      --red: #ff453a;
      --orange: #ff9f0a;
      --card-shadow: none;
      --dock-shadow: 0 12px 36px rgba(0, 0, 0, 0.65);
      --drag-shadow: 0 18px 42px rgba(0, 0, 0, 0.7);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.24s ease, color 0.24s ease;
    }

    body {
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .hidden { display: none !important; }
    svg { display: block; flex-shrink: 0; }

    /* Экран загрузки */
    .splash-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      transition: opacity 0.28s ease, visibility 0.28s ease;
    }
    .splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .splash-icon {
      width: 78px;
      height: 78px;
      border-radius: 20px;
      object-fit: cover;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22);
      animation: splashPulse 1.8s ease-in-out infinite;
    }
    .splash-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .spinner {
      width: 22px;
      height: 22px;
      border: 2.5px solid var(--subtle-bg);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes splashPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    /* Плавные GPU-анимации */
    @keyframes tabEnter {
      from { opacity: 0; transform: translate3d(0, 6px, 0); }
      to { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    @keyframes daySlideNext {
      from { opacity: 0; transform: translate3d(12px, 0, 0); }
      to { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    @keyframes daySlidePrev {
      from { opacity: 0; transform: translate3d(-12px, 0, 0); }
      to { opacity: 1; transform: translate3d(0, 0, 0); }
    }

    .tab-enter { animation: tabEnter 0.22s var(--ease-ios) both; will-change: transform, opacity; }
    .day-slide-next { animation: daySlideNext 0.2s var(--ease-ios) both; will-change: transform, opacity; }
    .day-slide-prev { animation: daySlidePrev 0.2s var(--ease-ios) both; will-change: transform, opacity; }

    /* Авторизация */
    .auth-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 390px;
      background: var(--surface-solid);
      border-radius: 26px;
      padding: 26px;
      box-shadow: var(--dock-shadow);
      animation: tabEnter 0.28s var(--ease-ios) both;
    }
    .auth-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .auth-icon {
      width: 46px;
      height: 46px;
      border-radius: 13px;
      object-fit: cover;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16);
      flex-shrink: 0;
    }
    .auth-brand h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
    .auth-brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }

    .auth-notice {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 12px 13px;
      border-radius: 14px;
      background: var(--accent-soft);
      color: var(--text);
      font-size: 13px;
      line-height: 1.45;
      animation: tabEnter 0.22s var(--ease-ios) both;
    }
    .auth-notice svg { color: var(--accent); margin-top: 2px; }
    .auth-notice strong { display: block; margin-bottom: 2px; font-size: 14px; }

    /* Верхняя панель */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--topbar);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      width: 100%;
      max-width: var(--app-width);
      margin: 0 auto;
      padding: 11px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      object-fit: cover;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.16);
    }

    /* Нижняя плавающая панель */
    .bottom-nav-wrap {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(14px + var(--safe-bottom));
      z-index: 30;
      display: flex;
      justify-content: center;
      padding: 0 16px;
      pointer-events: none;
    }
    .bottom-nav {
      pointer-events: auto;
      position: relative;
      width: 100%;
      max-width: 310px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      padding: 5px;
      border-radius: 24px;
      background: var(--dock-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      box-shadow: var(--dock-shadow);
    }
    .nav-slider {
      position: absolute;
      top: 5px;
      left: 5px;
      width: calc((100% - 10px) / 2);
      height: calc(100% - 10px);
      border-radius: 19px;
      background: var(--subtle-bg);
      transform: translate3d(calc(var(--idx, 0) * 100%), 0, 0);
      transition: transform 0.28s var(--ease-ios);
      will-change: transform;
      pointer-events: none;
    }
    .nav-btn {
      position: relative;
      z-index: 1;
      border: none;
      background: transparent;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 7px 0;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.18s ease, transform 0.14s var(--ease-ios);
    }
    .nav-btn:active { transform: scale(0.94); }
    .nav-btn.active { color: var(--accent); }
    .nav-btn svg { width: 21px; height: 21px; }

    /* Контейнер */
    .container {
      width: 100%;
      max-width: var(--app-width);
      margin: 0 auto;
      padding: 16px 16px calc(96px + var(--safe-bottom));
      flex: 1;
    }

    /* Профиль в шапке */
    .profile-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--subtle-bg);
      border: none;
      color: var(--text);
      padding: 3px 12px 3px 3px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.16s var(--ease-ios);
    }
    .profile-pill:active { transform: scale(0.95); }
    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      overflow: hidden;
      flex-shrink: 0;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    /* Вкладки дней недели (Пн–Пт) */
    .days-bar {
      position: relative;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: var(--subtle-bg);
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 16px;
    }
    .day-slider {
      position: absolute;
      top: 4px;
      left: 4px;
      width: calc((100% - 8px) / 5);
      height: calc(100% - 8px);
      border-radius: 10px;
      background: var(--seg-active);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      transform: translate3d(calc(var(--idx, 0) * 100%), 0, 0);
      transition: transform 0.26s var(--ease-ios);
      will-change: transform;
      pointer-events: none;
    }
    .day-btn {
      position: relative;
      z-index: 1;
      border: none;
      background: transparent;
      padding: 9px 0;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      text-align: center;
      transition: color 0.18s ease;
    }
    .day-btn.active { color: var(--text); }

    /* Segmented Control */
    .segmented {
      position: relative;
      display: grid;
      grid-template-columns: repeat(var(--cols, 3), 1fr);
      background: var(--subtle-bg);
      padding: 3px;
      border-radius: 12px;
      width: 100%;
    }
    .seg-slider {
      position: absolute;
      top: 3px;
      left: 3px;
      width: calc((100% - 6px) / var(--cols, 3));
      height: calc(100% - 6px);
      border-radius: 9px;
      background: var(--seg-active);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
      transform: translate3d(calc(var(--idx, 0) * 100%), 0, 0);
      transition: transform 0.26s var(--ease-ios);
      will-change: transform;
      pointer-events: none;
    }
    .segmented button {
      position: relative;
      z-index: 1;
      background: transparent;
      color: var(--muted);
      border: none;
      padding: 8px 6px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.18s ease;
    }
    .segmented button.active { color: var(--text); }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .section-head h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }

    /* Поля и кнопки */
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 13px; font-weight: 600; color: var(--muted); }
    input, textarea, select {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--input-
