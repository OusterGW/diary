<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" id="themeColorMeta" content="#f2f2f7" />
  <title>Diary — Дневник класса</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ЭКРАН ЗАГРУЗКИ -->
  <div id="splashView" class="splash-screen">
    <img src="icon.png" class="splash-icon" alt="Diary" onerror="this.style.display='none'" />
    <div class="splash-title">Diary</div>
    <div id="splashSpinner" class="spinner"></div>
    <div id="splashError" class="splash-error hidden"></div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="toast"></div>

  <!-- АВТОРИЗАЦИЯ -->
  <div id="authView" class="auth-wrap hidden">
    <div class="auth-card stack">
      <div class="auth-brand">
        <img src="icon.png" class="auth-icon" alt="Diary" onerror="this.style.display='none'" />
        <div>
          <h1>Diary</h1>
          <p>Школьное расписание, ДЗ и фото</p>
        </div>
      </div>

      <div class="segmented" style="--cols:2;">
        <div class="seg-slider" id="authSlider" style="--idx:0;"></div>
        <button type="button" id="authTabLogin" class="active" onclick="switchAuthTab('login')">Вход</button>
        <button type="button" id="authTabSignup" onclick="switchAuthTab('signup')">Регистрация</button>
      </div>

      <form id="authForm" class="stack" onsubmit="handleAuthSubmit(event)">
        <div id="nameFieldWrap" class="field hidden">
          <label>Имя</label>
          <input id="nameInput" type="text" placeholder="Ваше имя" autocomplete="name" />
        </div>
        <div class="field">
          <label>Email</label>
          <input id="emailInput" type="email" placeholder="name@example.com" autocomplete="email" required />
        </div>
        <div class="field">
          <label>Пароль</label>
          <input id="passInput" type="password" placeholder="Минимум 6 символов" autocomplete="current-password" required />
        </div>
        <button id="authSubmitBtn" type="submit" class="btn" style="width:100%; margin-top:2px;">Войти</button>
      </form>

      <div id="authMsg" class="msg"></div>
      <div id="authNotice" class="auth-notice hidden"></div>
    </div>
  </div>

  <!-- ОСНОВНОЕ ПРИЛОЖЕНИЕ -->
  <div id="appView" class="hidden">
    <header class="topbar">
      <div class="topbar-inner">
        <button id="menuToggleBtn" class="icon-nav-btn" onclick="toggleTopMenu()" aria-label="Меню">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="4" y1="7" x2="20" y2="7"></line>
            <line x1="4" y1="12" x2="20" y2="12"></line>
            <line x1="4" y1="17" x2="20" y2="17"></line>
          </svg>
        </button>
        <div class="brand">
          <img src="icon.png" class="brand-icon" alt="" onerror="this.style.display='none'" />
          <span>Diary</span>
        </div>
        <button id="themeToggleBtn" class="theme-toggle-btn" onclick="toggleThemeQuick()" aria-label="Сменить тему"></button>
      </div>
    </header>

    <!-- ВЫПАДАЮЩЕЕ МЕНЮ СЛЕВА СВЕРХУ -->
    <div id="topMenuBackdrop" class="top-menu-backdrop" onclick="closeTopMenu()"></div>
    <div id="topMenu" class="top-menu" role="menu">
      <button id="menuItemProfile" class="top-menu-item" onclick="openPageFromMenu('profile')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4 20c0-3.87 3.58-7 8-7s8 3.13 8 7"></path>
        </svg>
        <span>Профиль</span>
      </button>
      <div class="top-menu-divider"></div>
      <button id="menuItemBugs" class="top-menu-item" onclick="openPageFromMenu('bugs')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 7a4 4 0 0 1 8 0"></path>
          <rect x="6" y="7" width="12" height="13" rx="6"></rect>
          <line x1="6" y1="13" x2="18" y2="13"></line>
          <line x1="3" y1="10" x2="6" y2="11"></line>
          <line x1="21" y1="10" x2="18" y2="11"></line>
          <line x1="3" y1="16" x2="6.3" y2="15"></line>
          <line x1="21" y1="16" x2="17.7" y2="15"></line>
        </svg>
        <span>Отправить баг</span>
      </button>
    </div>

    <main class="container">
      <!-- СТРАНИЦА ДЗ -->
      <section id="pageHw">
        <div class="days-bar" id="daysBar">
          <div class="day-slider" id="daySlider"></div>
        </div>
        <div class="section-head">
          <h2 id="dayTitle">Понедельник</h2>
          <button id="addLessonBtn" class="btn sm hidden" onclick="openLessonModal(null)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>Урок</span>
          </button>
        </div>

        <div id="adminScheduleBar" class="admin-bar hidden">
          <button id="setBaseBtn" class="btn secondary" onclick="saveCurrentDayAsBase()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            <span>Сделать основным</span>
          </button>
          <button id="restoreBaseBtn" class="btn secondary" onclick="restoreDayFromBase()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
            <span>Вернуть основное</span>
          </button>
        </div>

        <div id="lessonsList" class="lesson-list"></div>
      </section>

      <!-- СТРАНИЦА УЧАСТНИКИ -->
      <section id="pageMembers" class="hidden">
        <div class="section-head">
          <h2>Участники</h2>
        </div>
        <div id="membersList" class="members-grid"></div>
      </section>

      <!-- СТРАНИЦА ПРОФИЛЬ -->
      <section id="pageProfile" class="hidden">
        <div id="profileContent" class="stack"></div>
      </section>

      <!-- СТРАНИЦА ОТПРАВИТЬ БАГ -->
      <section id="pageBugs" class="hidden">
        <div class="section-head">
          <h2 id="bugsPageTitle">Отправить баг</h2>
          <button id="addBugBtn" class="btn sm" onclick="openBugModal()" aria-label="Добавить отзыв">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
        <div id="bugsList" class="stack"></div>
      </section>
    </main>

    <!-- НИЖНЯЯ НАВИГАЦИЯ (2 ВКЛАДКИ) -->
    <div class="bottom-nav-wrap">
      <nav class="bottom-nav">
        <div class="nav-slider" id="navSlider"></div>
        <button id="navHw" class="nav-btn active" onclick="switchPage('hw')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="17" rx="3"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
            <path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"></path>
          </svg>
          <span>ДЗ</span>
        </button>
        <button id="navMembers" class="nav-btn" onclick="switchPage('members')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <span>Участники</span>
        </button>
      </nav>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО -->
  <div id="modalBackdrop" class="modal-backdrop" onclick="if(event.target===this) closeModal()">
    <div class="modal" id="modalContent"></div>
  </div>

  <!-- ЛАЙТБОКС -->
  <div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <img id="lightboxImg" src="" alt="Фото" />
  </div>

  <datalist id="subjectSuggestions">
    <option value="Алгебра"></option>
    <option value="Геометрия"></option>
    <option value="Вероятность и статистика"></option>
    <option value="Физика"></option>
    <option value="Химия"></option>
    <option value="Биология"></option>
    <option value="Информатика"></option>
    <option value="Русский язык"></option>
    <option value="Литература"></option>
    <option value="Англ. язык"></option>
    <option value="История"></option>
    <option value="Обществознание"></option>
    <option value="География"></option>
    <option value="ОБЗР"></option>
    <option value="Физкультура"></option>
    <option value="Проектная деятельность"></option>
    <option value="Разговор о важном"></option>
    <option value="Россия — мои горизонты"></option>
  </datalist>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/lessons.js"></script>
  <script src="js/members.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/bugs.js?v=2"></script>
  <script src="js/main.js?v=2"></script>
</body>
</html>
